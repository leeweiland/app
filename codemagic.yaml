workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add iOS platform
        script: |
          mkdir -p www
          rm -rf ios
          npx cap add ios
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Add Firebase config for push notifications
        script: |
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          gem install xcodeproj --no-document
          ruby -e "
            require 'xcodeproj'
            project_path = 'ios/App/App.xcodeproj'
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.first
            group = project.main_group.find_subpath('App', true)
            file_ref = group.new_reference('GoogleService-Info.plist')
            target.add_resources([file_ref])
            project.save
          "
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          echo "=== SAVE THIS TO CERTIFICATE_PRIVATE_KEY ENV VAR ==="
          cat /tmp/cert_key.pem
          echo "=== END KEY ==="
          app-store-connect fetch-signing-files com.pacificrimathleticsapp.app \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
