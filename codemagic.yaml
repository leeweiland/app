workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app
    environment:
      groups:
        - ios-signing
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add iOS platform
        script: |
          mkdir -p www
          rm -rf ios
          npx cap add ios
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Add Firebase config and Push Notifications capability
        script: |
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          cp ios-config/App.entitlements ios/App/App/App.entitlements
          # npx cap add ios regenerates AppDelegate.swift from Capacitor's
          # bare template every build, which is missing the two methods
          # that relay APNs' didRegisterForRemoteNotificationsWithDeviceToken/
          # didFailToRegisterForRemoteNotificationsWithError callbacks into
          # Capacitor's NotificationCenter bridge — without them,
          # PushNotifications.register() resolves but no token/error ever
          # reaches JS. This copy restores the version with those methods.
          cp ios-config/AppDelegate.swift ios/App/App/AppDelegate.swift
          # Declares the app as export-compliance-exempt (standard HTTPS/TLS
          # only, no custom encryption) so App Store Connect stops flagging
          # every uploaded build "Missing Compliance" and requiring someone
          # to manually answer the encryption questionnaire each time.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          gem install xcodeproj --no-document
          # A real Unix timestamp instead of $CM_BUILD_NUMBER — that
          # variable came out empty when this ran (confirmed by the
          # uploaded build's CFBundleVersion coming out blank, which
          # altool then rejected outright), so it's either not the right
          # variable name or not populated at this point in the build.
          # A timestamp needs no Codemagic-specific variable to exist at
          # all, and is guaranteed to keep increasing build over build.
          BUILD_NUMBER=$(date +%s)
          ruby -e "
            require 'xcodeproj'
            project_path = 'ios/App/App.xcodeproj'
            project = Xcodeproj::Project.open(project_path)
            target = project.targets.first
            group = project.main_group.find_subpath('App', true)
            plist_ref = group.new_reference('GoogleService-Info.plist')
            target.add_resources([plist_ref])
            group.new_reference('App.entitlements')
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
              # npx cap add ios regenerates the project from Capacitor's
              # template every build, which always hardcodes the build
              # number back to 1 — colliding with whatever was uploaded to
              # App Store Connect last time, since Apple requires every
              # upload to strictly increase.
              config.build_settings['CURRENT_PROJECT_VERSION'] = '$BUILD_NUMBER'
            end
            project.save
          "
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          # This used to generate a brand-new key and pass --create on
          # EVERY build — works exactly once (when no Distribution
          # certificate exists yet), then fails every build after that with
          # "you already have a current Distribution certificate", since
          # Apple only allows one active at a time and a fresh key each run
          # can never match whichever one already exists. Reusing the same
          # saved key (once CERTIFICATE_PRIVATE_KEY exists as a Codemagic
          # env var) lets it fetch that same certificate instead of trying
          # to create a new one every time.
          if [ -n "$CERTIFICATE_PRIVATE_KEY_B64" ]; then
            # Base64-encoded is the reliable format here — the plain
            # CERTIFICATE_PRIVATE_KEY variable's newlines got mangled at
            # some point (pasting multi-line PEM content into a single-line
            # env var field is a classic way that happens), which is why
            # "app-store-connect: error: Not a valid certificate private
            # key" showed up despite the variable clearly being set.
            # Base64 has no newlines to lose in the first place.
            echo "$CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -d -A -out /tmp/cert_key.pem
            CREATE_FLAG=""
          elif [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
            CREATE_FLAG=""
          else
            echo "No certificate key set — generating one now (first-time setup only)."
            openssl genrsa -out /tmp/cert_key.pem 2048
            echo "=== SAVE THIS TO CERTIFICATE_PRIVATE_KEY ENV VAR IN CODEMAGIC, THEN EVERY FUTURE BUILD REUSES IT ==="
            cat /tmp/cert_key.pem
            echo "=== END KEY ==="
            CREATE_FLAG="--create"
          fi
          app-store-connect fetch-signing-files com.pacificrimathleticsapp.app \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            $CREATE_FLAG
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
