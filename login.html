<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>PRA Chat — Sign In</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  body { margin: 0; }
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 420px; padding: 36px 32px; }
  .auth-logo { text-align: center; margin-bottom: 22px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 26px; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 4px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; cursor: pointer; font-family: var(--font-secondary); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--pra-dim); }
  .auth-tab.active { background: var(--pra-blue); color: #fff; }
  .field { margin-bottom: 14px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .avatar-picker { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .avatar-picker .pra-avatar { width: 56px; height: 56px; font-size: 1.3rem; }
  .avatar-picker input { display: none; }
  .err-msg { color: #ff5c5c; font-size: .82rem; margin: -4px 0 14px; min-height: 1em; font-family: var(--font-secondary); }
  form.hidden { display: none; }
  .pw-field { position: relative; }
  .pw-field .pra-input { padding-right: 46px; }
  .pw-toggle {
    position: absolute; right: 6px; top: 6px;
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--pra-border);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .pw-toggle:hover { border-color: var(--pra-blue); background: rgba(0,155,255,0.1); }
  .pw-toggle svg { width: 17px; height: 17px; overflow: visible; filter: drop-shadow(0 0 3px rgba(255,255,255,.7)); }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pra-bg"></div>
  <script src="/nav.js"></script>
  <div class="auth-wrap">
    <div class="pra-panel auth-card">
      <div class="auth-logo">
        <img src="/chat-app/assets/pra-logo.png" alt="Pacific Rim Athletics" style="width:180px;height:auto;display:inline-block"/>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin">Sign In</div>
        <div class="auth-tab" id="tabSignup">Sign Up</div>
      </div>

      <div class="err-msg" id="errMsg"></div>

      <form id="loginForm">
        <div class="field"><label class="pra-label">Email</label><br/>
          <input class="pra-input" type="email" id="loginEmail" required style="margin-top:6px"/></div>
        <div class="field"><label class="pra-label">Password</label><br/>
          <div class="pw-field" style="margin-top:6px">
            <input class="pra-input" type="password" id="loginPassword" required/>
            <button type="button" class="pw-toggle" data-target="loginPassword" aria-label="Show password"></button>
          </div>
        </div>
        <div style="text-align:right;margin-bottom:8px"><span class="pra-link" id="forgotLink" style="font-size:.8rem">Forgot password?</span></div>
        <button class="pra-btn" type="submit" style="width:100%">SIGN IN</button>
      </form>

      <form id="forgotForm" class="hidden">
        <div class="pra-muted" style="font-size:.82rem;margin-bottom:14px">Enter your email and we'll send you a reset link.</div>
        <div class="field"><label class="pra-label">Email</label><br/>
          <input class="pra-input" type="email" id="forgotEmail" required style="margin-top:6px"/></div>
        <button class="pra-btn" type="submit" style="width:100%;margin-top:8px">SEND RESET LINK</button>
        <div style="text-align:center;margin-top:12px"><span class="pra-link" id="backToLoginLink" style="font-size:.8rem">Back to sign in</span></div>
      </form>

      <form id="signupForm" class="hidden">
        <div class="avatar-picker">
          <div class="pra-avatar" id="avatarPreview">＋</div>
          <div>
            <label class="pra-btn pra-btn-ghost" for="profilePicInput" style="display:inline-block">Add Photo (optional)</label>
            <input type="file" id="profilePicInput" accept="image/*"/>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label class="pra-label">First Name</label><br/>
            <input class="pra-input" id="suFirst" required style="margin-top:6px"/></div>
          <div class="field"><label class="pra-label">Last Name</label><br/>
            <input class="pra-input" id="suLast" required style="margin-top:6px"/></div>
        </div>
        <div class="field"><label class="pra-label">Email</label><br/>
          <input class="pra-input" type="email" id="suEmail" required style="margin-top:6px"/></div>
        <div class="field"><label class="pra-label">Phone</label><br/>
          <input class="pra-input" type="tel" id="suPhone" style="margin-top:6px"/></div>
        <div class="field"><label class="pra-label">Password</label><br/>
          <div class="pw-field" style="margin-top:6px">
            <input class="pra-input" type="password" id="suPassword" required minlength="8"/>
            <button type="button" class="pw-toggle" data-target="suPassword" aria-label="Show password"></button>
          </div>
        </div>
        <button class="pra-btn" type="submit" style="width:100%;margin-top:8px">CREATE ACCOUNT</button>
      </form>
    </div>
  </div>
</div>

<script>
const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');
const forgotForm = document.getElementById('forgotForm');
const errMsg = document.getElementById('errMsg');

function showForm(form) {
  [loginForm, signupForm, forgotForm].forEach(f => f.classList.toggle('hidden', f !== form));
  errMsg.textContent = '';
}

tabLogin.onclick = () => { tabLogin.classList.add('active'); tabSignup.classList.remove('active'); showForm(loginForm); };
tabSignup.onclick = () => { tabSignup.classList.add('active'); tabLogin.classList.remove('active'); showForm(signupForm); };
document.getElementById('forgotLink').onclick = () => showForm(forgotForm);
document.getElementById('backToLoginLink').onclick = () => { tabLogin.click(); };

forgotForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errMsg.textContent = '';
  const email = document.getElementById('forgotEmail').value;
  const r = await fetch('/api/auth/forgot-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
  const d = await r.json();
  forgotForm.innerHTML = '<div class="pra-muted" style="font-size:.85rem;text-align:center;padding:10px 0">' + (d.message || 'Check your email for a reset link.') + '</div>';
});

document.getElementById('profilePicInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('avatarPreview').innerHTML = '<img src="' + reader.result + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>';
  };
  reader.readAsDataURL(file);
});

function redirectAfterAuth() {
  const params = new URLSearchParams(location.search);
  location.href = params.get('next') || '/chat-app/chat.html';
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errMsg.textContent = '';
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const r = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) });
  const d = await r.json();
  if (!r.ok) { errMsg.textContent = d.error || 'Login failed'; return; }
  redirectAfterAuth();
});

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errMsg.textContent = '';
  const fd = new FormData();
  fd.append('first', document.getElementById('suFirst').value);
  fd.append('last', document.getElementById('suLast').value);
  fd.append('email', document.getElementById('suEmail').value);
  fd.append('phone', document.getElementById('suPhone').value);
  fd.append('password', document.getElementById('suPassword').value);
  const picFile = document.getElementById('profilePicInput').files[0];
  if (picFile) fd.append('profilePicture', picFile);
  const r = await fetch('/api/auth/signup', { method: 'POST', body: fd });
  const d = await r.json();
  if (!r.ok) { errMsg.textContent = d.error || 'Sign up failed'; return; }
  redirectAfterAuth();
});

// Already logged in? skip straight to chat.
fetch('/api/auth/me').then(r => r.ok ? redirectAfterAuth() : null).catch(() => {});

const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSED = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M6.6 6.7C3.9 8.4 1 12 1 12s4 7 11 7c2.1 0 3.9-.6 5.4-1.4"/><path d="M17.9 17.9C20.4 16.2 23 12 23 12s-1.6-2.8-4.4-4.8"/><path d="M9.5 4.6C10.3 4.2 11.1 4 12 4c7 0 11 7 11 7"/></svg>';

document.querySelectorAll('.pw-toggle').forEach(btn => {
  btn.innerHTML = EYE_CLOSED;
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    btn.innerHTML = hidden ? EYE_OPEN : EYE_CLOSED;
    btn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  });
});
</script>
</body>
</html>
