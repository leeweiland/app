<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Powerbatics Training Videos — PRA</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  body { margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .yt-card { overflow: hidden; cursor: pointer; transition: box-shadow .18s, transform .12s; }
  .yt-card:hover { box-shadow: 0 0 18px var(--pra-blue-glow); transform: translateY(-2px); }
  .yt-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
  .yt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .yt-thumb .play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--pra-blue); filter: drop-shadow(0 0 6px var(--pra-blue-glow)); pointer-events: none; }
  .yt-info { padding: 12px 14px; }
  .yt-title { font-weight: 700; font-size: .92rem; line-height: 1.35; }
  .yt-date { font-family: var(--font-secondary); font-size: .74rem; color: var(--pra-dim); margin-top: 4px; }

  /* Plays right in the feed (no popup): the tapped card's thumbnail becomes
     the YouTube player. */
  .yt-card.playing { cursor: default; transform: none !important; box-shadow: 0 0 18px var(--pra-blue-glow); }
  .yt-thumb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Phone turned sideways while a video plays: the player fills the screen.
     Real fullscreen when the phone allows it; otherwise this black layer over
     everything (iPhones don't let a YouTube embed go fullscreen from code). */
  .yt-thumb.yt-fs { position: fixed !important; inset: 0; width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; z-index: 100000; background: #000; }
  html.yt-fs-on, html.yt-fs-on body { overflow: hidden !important; }
  html.yt-fs-on .yt-card { transform: none !important; }
  .yt-thumb:fullscreen { width: 100%; height: 100%; aspect-ratio: auto; background: #000; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pra-bg"></div>
  <script src="/nav.js"></script>
  <script src="/chat-app/chat-header.js"></script>
  <div class="wrap">
    <div class="pra-h1 pra-glow" style="margin-bottom:18px;font-family:var(--font-secondary)">Powerbatics Training Videos</div>
    <div class="grid" id="grid"><div class="pra-muted">Loading…</div></div>
  </div>
</div>

<script>
// Lee Weiland YouTube channel, long-form videos only (no Shorts), newest first.
let videos = [];
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch { return ''; } };

async function load() {
  const grid = document.getElementById('grid');
  try {
    const r = await fetch('/api/moves-dictionary/youtube');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    videos = d.videos || [];
  } catch (e) {
    grid.innerHTML = '<div class="pra-muted">Could not load the videos right now. Try again in a minute.</div>';
    return;
  }
  grid.innerHTML = videos.map(v => `
    <div class="pra-card yt-card" data-id="${esc(v.id)}">
      <div class="yt-thumb"><img loading="lazy" src="${esc(v.thumb)}" alt=""><div class="play-icon">▶</div></div>
      <div class="yt-info">
        <div class="yt-title">${esc(v.title)}</div>
        <div class="yt-date">${fmtDate(v.publishedAt)}</div>
      </div>
    </div>`).join('') || '<div class="pra-muted">No videos yet.</div>';
  grid.querySelectorAll('.yt-card').forEach(el => el.onclick = () => playInFeed(el));
}

// ── Play in the feed ────────────────────────────────────────────────────
// One video at a time: starting another puts the last one back to its
// thumbnail (which also stops it).
let playingCard = null;
function stopPlaying() {
  if (!playingCard) return;
  exitFullscreen();
  const v = videos.find(x => x.id === playingCard.dataset.id);
  playingCard.querySelector('.yt-thumb').innerHTML = v ? `<img src="${esc(v.thumb)}" alt=""><div class="play-icon">▶</div>` : '';
  playingCard.classList.remove('playing');
  playingCard = null;
}
function playInFeed(card) {
  if (card === playingCard) return;
  stopPlaying();
  const id = card.dataset.id;
  card.querySelector('.yt-thumb').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  card.classList.add('playing');
  playingCard = card;
}

// ── Sideways = fullscreen ───────────────────────────────────────────────
// Phones only (not tablets/computers, which are often landscape anyway), and
// only on an actual rotation while a video is playing. Real fullscreen when
// the phone allows it (a rotation counts as the user's go-ahead on Android);
// otherwise the player is pinned over the whole screen. Turning back upright
// (or Android's back button) leaves fullscreen and the video keeps playing.
const isPhone = () => Math.min(screen.width, screen.height) < 600 && matchMedia('(pointer: coarse)').matches;
const isLandscape = () => (screen.orientation && screen.orientation.type) ? screen.orientation.type.startsWith('landscape') : Math.abs(window.orientation || 0) === 90;
let fsThumb = null, rootContainer = null;
function enterFullscreen() {
  if (!playingCard || fsThumb) return;
  const thumb = playingCard.querySelector('.yt-thumb');
  fsThumb = thumb;
  // The pinned layer must cover the screen, not just the page box around it:
  // .pra-root is a size container, which would otherwise trap position:fixed.
  const root = document.querySelector('.pra-root');
  if (root) { rootContainer = root.style.containerType; root.style.containerType = 'normal'; }
  document.documentElement.classList.add('yt-fs-on');
  thumb.classList.add('yt-fs');
  const req = thumb.requestFullscreen || thumb.webkitRequestFullscreen;
  if (req) { try { const p = req.call(thumb); if (p && p.catch) p.catch(() => {}); } catch {} }
  if (window.PRABack) PRABack.push('yt-fs', () => exitFullscreen(true));
}
function exitFullscreen(fromBack) {
  if (!fsThumb) return;
  const thumb = fsThumb;
  fsThumb = null;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) { try { const p = (document.exitFullscreen || document.webkitExitFullscreen).call(document); if (p && p.catch) p.catch(() => {}); } catch {} }
  thumb.classList.remove('yt-fs');
  document.documentElement.classList.remove('yt-fs-on');
  const root = document.querySelector('.pra-root');
  if (root) root.style.containerType = rootContainer || '';
  if (!fromBack && window.PRABack) PRABack.closed('yt-fs');
  // Back where it was in the feed.
  if (playingCard) playingCard.scrollIntoView({ block: 'center' });
}
function onRotate() {
  if (!isPhone()) return;
  if (isLandscape()) enterFullscreen(); else exitFullscreen();
}
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onRotate);
else window.addEventListener('orientationchange', onRotate);
// Left real fullscreen some other way (e.g. YouTube's own button) while
// still sideways: drop the pinned layer too only when they're upright.
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fsThumb && !isLandscape()) exitFullscreen(); });

load();
</script>
</body>
</html>
