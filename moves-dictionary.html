<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Powerbatics Training Videos — PRA</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  body { margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .yt-card { overflow: hidden; cursor: pointer; transition: box-shadow .18s, transform .12s; }
  .yt-card:hover { box-shadow: 0 0 18px var(--pra-blue-glow); transform: translateY(-2px); }
  .yt-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
  .yt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .yt-thumb .play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--pra-blue); filter: drop-shadow(0 0 6px var(--pra-blue-glow)); pointer-events: none; }
  .yt-info { padding: 12px 14px; }
  .yt-title { font-weight: 700; font-size: .92rem; line-height: 1.35; }
  .yt-date { font-family: var(--font-secondary); font-size: .74rem; color: var(--pra-dim); margin-top: 4px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal-backdrop.show { display: flex; }
  .player-box { width: 100%; max-width: 860px; padding: 20px; }
  .player-frame { position: relative; width: 100%; aspect-ratio: 16/9; max-height: 70vh; border-radius: 10px; overflow: hidden; background: #000; }
  .player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pra-bg"></div>
  <script src="/nav.js"></script>
  <script src="/chat-app/chat-header.js"></script>
  <div class="wrap">
    <div class="pra-h1 pra-glow" style="margin-bottom:18px;font-family:var(--font-secondary)">Powerbatics Training Videos</div>
    <div class="grid" id="grid"><div class="pra-muted">Loading…</div></div>
  </div>

  <div class="modal-backdrop" id="playerModal">
    <div class="pra-panel player-box">
      <div class="pra-h2" id="playerTitle" style="margin-bottom:12px"></div>
      <div class="player-frame" id="playerFrame"></div>
      <button class="pra-btn pra-btn-ghost" style="margin-top:14px;width:100%" onclick="closePlayer()">Close</button>
    </div>
  </div>
</div>

<script>
// Lee Weiland YouTube channel, one feed, newest first.
let videos = [];
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch { return ''; } };

async function load() {
  const grid = document.getElementById('grid');
  try {
    const r = await fetch('/api/moves-dictionary/youtube');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    videos = d.videos || [];
  } catch (e) {
    grid.innerHTML = '<div class="pra-muted">Could not load the videos right now. Try again in a minute.</div>';
    return;
  }
  grid.innerHTML = videos.map(v => `
    <div class="pra-card yt-card" data-id="${esc(v.id)}">
      <div class="yt-thumb"><img loading="lazy" src="${esc(v.thumb)}" alt=""><div class="play-icon">▶</div></div>
      <div class="yt-info">
        <div class="yt-title">${esc(v.title)}</div>
        <div class="yt-date">${fmtDate(v.publishedAt)}</div>
      </div>
    </div>`).join('') || '<div class="pra-muted">No videos yet.</div>';
  grid.querySelectorAll('.yt-card').forEach(el => el.onclick = () => openPlayer(el.dataset.id));
}

function openPlayer(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  document.getElementById('playerTitle').textContent = v.title;
  document.getElementById('playerFrame').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  document.getElementById('playerModal').classList.add('show');
}
function closePlayer() {
  document.getElementById('playerFrame').innerHTML = '';
  document.getElementById('playerModal').classList.remove('show');
}
document.getElementById('playerModal').addEventListener('click', (e) => { if (e.target.id === 'playerModal') closePlayer(); });

load();
</script>
</body>
</html>
