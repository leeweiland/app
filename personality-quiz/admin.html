<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PERSONALITY QUIZ ADMIN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0f1117;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}

.topbar{background:#1a1a2e;border-bottom:1px solid #2a2a4a;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:bold;color:#fff;white-space:nowrap}
.topbar .spacer{flex:1}
.topbar a.live-link{color:#58a6ff;text-decoration:none;font-size:12px;font-weight:bold}
.topbar a.live-link:hover{text-decoration:underline}
.save-btn{padding:8px 18px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:bold;background:#1a6fd4;color:#fff;transition:opacity .15s}
.save-btn:hover{opacity:.85}
.save-btn:disabled{opacity:.5;cursor:default}
.save-status{font-size:11px;color:#3fb950;min-width:110px}
.save-status.err{color:#f85149}

.tabs{padding:10px 20px 0 20px;background:#15151f;border-bottom:1px solid #222;display:flex;gap:6px}
.tab-btn{background:#1c1c2e;border:1px solid #2a2a4a;border-bottom:none;border-radius:8px 8px 0 0;color:#8b949e;padding:9px 16px;font-size:12px;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.tab-btn.active{background:#161b22;color:#58a6ff}

.content{padding:22px;max-width:1100px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}

.card{background:#161b22;border:1px solid #30363d;border-radius:10px;margin-bottom:16px;overflow:hidden}
.card-title{padding:12px 16px;font-size:13px;font-weight:bold;background:#1a1a2e;border-bottom:1px solid #2a2a4a;color:#58a6ff}
.card-body{padding:16px}

.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.field input[type=text],.field input[type=url],.field input[type=color],.field textarea{
  width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:13px;padding:8px 10px;font-family:inherit;outline:none
}
.field input:focus,.field textarea:focus{border-color:#58a6ff}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:flex;gap:12px;flex-wrap:wrap}
.field-row .field{flex:1;min-width:220px}
.hint{font-size:11px;color:#666;margin-top:3px}

.q-row{display:flex;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid #1e222b}
.q-row:last-child{border-bottom:none}
.q-num{color:#8b949e;font-weight:bold;font-size:12px;padding-top:9px;width:26px;flex-shrink:0}
.q-fields{flex:1;display:flex;flex-direction:column;gap:6px}
.q-fields input{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:13px;padding:7px 10px;font-family:inherit}
.q-values{font-size:11px;color:#8b949e;font-family:monospace}
.q-del{background:#3a1d1d;color:#f85149;border:1px solid #5a2a2a;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:11px;flex-shrink:0}
.q-del:hover{background:#4a2323}
.add-q-btn{margin:12px 16px;padding:8px 14px;border-radius:6px;border:1px dashed #3a3f4a;background:transparent;color:#8b949e;cursor:pointer;font-size:12px}
.add-q-btn:hover{border-color:#58a6ff;color:#58a6ff}

.arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.arch-card{background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}
.arch-hdr{padding:10px 14px;background:#1a1a2e;border-bottom:1px solid #2a2a4a;display:flex;align-items:center;gap:8px}
.arch-mbti{font-weight:bold;color:#3fb950;font-size:13px}
.arch-hdr .standard{color:#8b949e;font-size:11px}
.arch-body{padding:14px}
.img-row{display:flex;gap:10px;margin-top:6px}
.img-col{flex:1}
.img-col img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#0d1117;border:1px solid #30363d;margin-bottom:6px}
.img-col label{display:block;font-size:10px;color:#8b949e;text-transform:uppercase;margin-bottom:3px}
.img-col input[type=url]{font-size:11px;padding:6px 8px}
.upload-btn{display:inline-block;font-size:10px;color:#58a6ff;cursor:pointer;margin-top:4px}
.elements-checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.elements-checks label{display:flex;align-items:center;gap:5px;font-size:11px;color:#c9d1d9;font-weight:normal;text-transform:none;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:5px 9px;cursor:pointer}
.elements-checks input{width:auto!important}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid #2a2a4a}
td{padding:10px 12px;border-bottom:1px solid #1e222b;font-size:12px}
tr:last-child td{border-bottom:none}
.empty{padding:40px;text-align:center;color:#666}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
</style>
</head>
<body>

<script src="/nav.js"></script>

<div class="topbar">
  <h1>PERSONALITY QUIZ ADMIN</h1>
  <a class="live-link" href="/personality-quiz/" target="_blank">View Live Quiz ↗</a>
  <div class="spacer"></div>
  <span class="save-status" id="saveStatus"></span>
  <button class="save-btn" id="saveBtn">Save Changes</button>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="settings">Settings</button>
  <button class="tab-btn" data-tab="questions">Questions</button>
  <button class="tab-btn" data-tab="archetypes">Archetypes</button>
  <button class="tab-btn" data-tab="leads">Leads</button>
</div>

<div class="content">

  <div class="tab-panel active" id="panel-settings"></div>
  <div class="tab-panel" id="panel-questions"></div>
  <div class="tab-panel" id="panel-archetypes"></div>
  <div class="tab-panel" id="panel-leads"></div>

</div>

<script>
let CONFIG = null;

async function load() {
  const res = await fetch('/api/personality-quiz/config');
  CONFIG = await res.json();
  renderSettings();
  renderQuestions();
  renderArchetypes();
  loadLeads();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Settings ────────────────────────────────────────────────────────────
const SETTINGS_FIELDS = [
  { key: 'siteTitle', label: 'Site / Browser Tab Title' },
  { key: 'quizHeading', label: 'Quiz Screen Heading' },
  { key: 'resultHeading', label: 'Result Page Title' },
  { key: 'logoUrl', label: 'Logo Image URL', type: 'url' },
  { key: 'accentColor', label: 'Accent Color', type: 'color' },
  { key: 'backgroundColor', label: 'Background Color', type: 'color' },
  { key: 'contactHeading', label: 'Contact Screen Heading' },
  { key: 'contactSubheading', label: 'Contact Screen Subheading' },
  { key: 'genderQuestionText', label: 'Gender Question Text' },
  { key: 'retakeButtonText', label: 'Retake Quiz Button Text' },
  { key: 'ctaButtonText', label: 'CTA Button Text (supports <br>)' },
  { key: 'ctaButtonUrl', label: 'CTA Button Link URL', type: 'url' },
  { key: 'shareHeading', label: 'Share Section Heading' },
  { key: 'shareSubheading', label: 'Share Section Subheading' },
  { key: 'leadWebhookUrl', label: 'Lead Webhook URL (optional — forwards each submission, e.g. Zapier)', type: 'url' },
];

function renderSettings() {
  const el = document.getElementById('panel-settings');
  el.innerHTML = `<div class="card"><div class="card-title">Quiz Settings</div><div class="card-body" id="settingsBody"></div></div>`;
  const body = document.getElementById('settingsBody');
  SETTINGS_FIELDS.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const inputType = f.type === 'color' ? 'color' : (f.type === 'url' ? 'url' : 'text');
    wrap.innerHTML = `<label>${f.label}</label><input type="${inputType}" value="${(CONFIG.settings[f.key] || '').replace(/"/g,'&quot;')}">`;
    const input = wrap.querySelector('input');
    input.addEventListener('input', () => { CONFIG.settings[f.key] = input.value; });
    body.appendChild(wrap);
  });
}

// ── Questions ───────────────────────────────────────────────────────────
function renderQuestions() {
  const el = document.getElementById('panel-questions');
  el.innerHTML = `<div class="card"><div class="card-title">Quiz Questions (${CONFIG.questions.length})</div><div id="qList"></div></div><button class="add-q-btn" id="addQBtn">+ Add Question</button>`;
  const list = document.getElementById('qList');
  CONFIG.questions.forEach((q, i) => {
    const row = document.createElement('div');
    row.className = 'q-row';
    row.innerHTML = `
      <div class="q-num">${i + 1}.</div>
      <div class="q-fields">
        <input type="text" class="q-text" value="${q.text.replace(/"/g,'&quot;')}" placeholder="Question text">
        <input type="text" class="q-values" value="${q.values.join(',')}" placeholder="Strongly Agree,Agree,Neutral,Disagree,Strongly Disagree codes (advanced — MBTI dimension:weight pairs)">
      </div>
      <button class="q-del">Remove</button>
    `;
    row.querySelector('.q-text').addEventListener('input', e => { CONFIG.questions[i].text = e.target.value; });
    row.querySelector('.q-values').addEventListener('input', e => { CONFIG.questions[i].values = e.target.value.split(',').map(s => s.trim()).filter(Boolean); });
    row.querySelector('.q-del').addEventListener('click', () => { CONFIG.questions.splice(i, 1); renderQuestions(); });
    list.appendChild(row);
  });
  document.getElementById('addQBtn').addEventListener('click', () => {
    CONFIG.questions.push({ text: 'New question text', values: ['E5I1','E4I2','E3I3','E2I4','E1I5'] });
    renderQuestions();
  });
}

// ── Archetypes ──────────────────────────────────────────────────────────
const ALL_ELEMENTS = ['Handstand','Ninja Strength','Powermoves','Cirque','Freerun'];

function renderArchetypes() {
  const el = document.getElementById('panel-archetypes');
  el.innerHTML = `<div class="arch-grid" id="archGrid"></div>`;
  const grid = document.getElementById('archGrid');
  Object.entries(CONFIG.archetypes).forEach(([mbti, data]) => {
    const card = document.createElement('div');
    card.className = 'arch-card';
    const elChecks = ALL_ELEMENTS.map(el2 => {
      const checked = data.elements.includes(el2) ? 'checked' : '';
      return `<label><input type="checkbox" data-el="${el2}" ${checked}>${el2}</label>`;
    }).join('');
    card.innerHTML = `
      <div class="arch-hdr"><span class="arch-mbti">${mbti}</span><span class="standard">(${data.standard})</span></div>
      <div class="arch-body">
        <div class="field-row">
          <div class="field"><label>Title (PRA Archetype)</label><input type="text" class="f-title" value="${data.title.replace(/"/g,'&quot;')}"></div>
          <div class="field"><label>Standard MBTI Name</label><input type="text" class="f-standard" value="${data.standard.replace(/"/g,'&quot;')}"></div>
        </div>
        <div class="field"><label>Summary</label><input type="text" class="f-summary" value="${data.summary.replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>Training Elements</label><div class="elements-checks">${elChecks}</div></div>
        <div class="field"><label>Strategy (HTML — supports &lt;strong&gt; &lt;br&gt;)</label><textarea class="f-strategy">${data.strategy}</textarea></div>
        <div class="img-row">
          <div class="img-col">
            <label>Male Image</label>
            <img class="img-male-preview" src="${data.images.male}" onerror="this.style.opacity=0.3">
            <input type="url" class="f-img-male" value="${data.images.male}">
            <label class="upload-btn">Upload new file<input type="file" accept="image/*" class="f-upload-male" style="display:none"></label>
          </div>
          <div class="img-col">
            <label>Female Image</label>
            <img class="img-female-preview" src="${data.images.female}" onerror="this.style.opacity=0.3">
            <input type="url" class="f-img-female" value="${data.images.female}">
            <label class="upload-btn">Upload new file<input type="file" accept="image/*" class="f-upload-female" style="display:none"></label>
          </div>
        </div>
      </div>
    `;
    card.querySelector('.f-title').addEventListener('input', e => { CONFIG.archetypes[mbti].title = e.target.value; });
    card.querySelector('.f-standard').addEventListener('input', e => { CONFIG.archetypes[mbti].standard = e.target.value; });
    card.querySelector('.f-summary').addEventListener('input', e => { CONFIG.archetypes[mbti].summary = e.target.value; });
    card.querySelector('.f-strategy').addEventListener('input', e => { CONFIG.archetypes[mbti].strategy = e.target.value; });
    card.querySelectorAll('.elements-checks input').forEach(cb => {
      cb.addEventListener('change', () => {
        const checked = [...card.querySelectorAll('.elements-checks input:checked')].map(c => c.dataset.el);
        CONFIG.archetypes[mbti].elements = checked;
      });
    });
    card.querySelector('.f-img-male').addEventListener('input', e => {
      CONFIG.archetypes[mbti].images.male = e.target.value;
      card.querySelector('.img-male-preview').src = e.target.value;
    });
    card.querySelector('.f-img-female').addEventListener('input', e => {
      CONFIG.archetypes[mbti].images.female = e.target.value;
      card.querySelector('.img-female-preview').src = e.target.value;
    });
    card.querySelector('.f-upload-male').addEventListener('change', e => uploadImage(e, mbti, 'male', card));
    card.querySelector('.f-upload-female').addEventListener('change', e => uploadImage(e, mbti, 'female', card));
    grid.appendChild(card);
  });
}

function uploadImage(e, mbti, which, card) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const filename = `${mbti.toLowerCase()}-${which}-${Date.now()}.${(file.name.split('.').pop() || 'png')}`;
    const res = await fetch('/api/personality-quiz/upload-image', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename, dataUrl: reader.result })
    });
    const data = await res.json();
    if (data.url) {
      CONFIG.archetypes[mbti].images[which] = data.url;
      card.querySelector(which === 'male' ? '.f-img-male' : '.f-img-female').value = data.url;
      card.querySelector(which === 'male' ? '.img-male-preview' : '.img-female-preview').src = data.url;
    }
  };
  reader.readAsDataURL(file);
}

// ── Leads ───────────────────────────────────────────────────────────────
async function loadLeads() {
  const el = document.getElementById('panel-leads');
  const res = await fetch('/api/personality-quiz/leads');
  const leads = await res.json();
  if (!leads.length) {
    el.innerHTML = `<div class="card"><div class="empty">No quiz submissions yet.</div></div>`;
    return;
  }
  const rows = leads.map(l => `
    <tr>
      <td>${l.receivedAt ? new Date(l.receivedAt).toLocaleString() : ''}</td>
      <td>${(l.firstName||'')} ${(l.lastName||'')}</td>
      <td>${l.email||''}</td>
      <td>${l.phone||''}</td>
      <td>${l.mbti||''}</td>
      <td>${l.archetype||''}</td>
      <td>${l.gender||''}</td>
    </tr>
  `).join('');
  el.innerHTML = `<div class="card"><div class="card-title">Quiz Submissions (${leads.length})</div>
    <table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>MBTI</th><th>Archetype</th><th>Gender</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

// ── Save ────────────────────────────────────────────────────────────────
document.getElementById('saveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  status.textContent = 'Saving…';
  status.className = 'save-status';
  try {
    const res = await fetch('/api/personality-quiz/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(CONFIG)
    });
    const data = await res.json();
    if (data.ok) {
      status.textContent = 'Saved ✓';
      setTimeout(() => { status.textContent = ''; }, 2500);
    } else {
      status.textContent = 'Error: ' + (data.error || 'save failed');
      status.className = 'save-status err';
    }
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    status.className = 'save-status err';
  }
  btn.disabled = false;
});

load();
</script>
</body>
</html>
