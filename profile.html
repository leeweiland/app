<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Profile — PRA Chat</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  /* iOS's native WKWebView page scroll is disabled app-wide
     (capacitor.config.json ios.scrollEnabled:false — needed to stop the
     whole page dragging around on chat.html, which never used native
     scroll to begin with). That silently broke every OTHER page like this
     one that just let the body scroll normally — nothing could undo it
     from CSS once disabled natively. Same fix as chat.html: pin html/body
     so nothing relies on native scroll, and let .pra-root do its own
     overflow-y:auto instead, which is a separate (WebKit, not native)
     scrolling mechanism the disabled flag doesn't touch. */
  html { height: 100%; overflow: hidden; }
  body { margin: 0; position: fixed; inset: 0; height: 100%; height: 100dvh; height: var(--app-vh, 100dvh); overflow: hidden; }
  /* position:absolute + inset:0 (against body's own fixed/inset:0 box)
     instead of height:100% -- guarantees .pra-root's hit-testable box is
     pixel-exact full-viewport on all four edges, so wheel-scroll works no
     matter where over the page the cursor is, not just directly over
     visible content. height:100% only pins vertical size; it doesn't force
     the box to claim the full horizontal area the same explicit way. */
  .pra-root { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; }
  .profile-card { padding: 32px; text-align: center; }
  .avatar-lg { width: 100px; height: 100px; margin: 0 auto 16px; font-size: 2.2rem; }
  .avatar-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar-wrap { position: relative; width: 100px; margin: 0 auto 16px; }
  .avatar-wrap .avatar-lg { margin: 0; }
  .avatar-edit-badge { position: absolute; top: -2px; right: -2px; width: 30px; height: 30px; border-radius: 50%; background: #12121f; border: 1.5px solid var(--pra-border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color .15s; }
  .avatar-edit-badge:hover { border-color: var(--pra-blue); }
  .avatar-edit-badge svg { width: 15px; height: 15px; }
  .role-badge { margin-top: 8px; }
  .fields { text-align: left; margin-top: 26px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; margin-bottom: 6px; }
  .btn-row { display: flex; gap: 10px; margin-top: 22px; }
  .archetype-link { text-decoration: none; display: block; }
  .archetype-link:hover .level-chip { border-color: var(--pra-blue); }
  .section-title { text-align: left; font-weight: 700; font-size: .95rem; margin: 28px 0 12px; padding-top: 20px; border-top: 1px solid var(--pra-border); }
  .save-msg { text-align: left; font-size: .78rem; color: var(--pra-blue); margin-top: 8px; min-height: 1em; }
  .levels-col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .level-chip { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--pra-border); border-radius: 8px; padding: 6px 12px; font-size: .8rem; width: 100%; max-width: 280px; }
  .level-chip .cat { font-family: var(--font-secondary); font-size: .68rem; color: var(--pra-dim); text-transform: uppercase; letter-spacing: .04em; flex: 1; }
  .level-chip .chip-val { font-weight: 700; white-space: nowrap; }
  .level-chip .chip-val.editable { cursor: pointer; border-radius: 5px; padding: 2px 6px; transition: background .15s; }
  .level-chip .chip-val.editable:hover { background: rgba(0,155,255,0.15); }
  .chip-val-input { width: 40px; font-size: .72rem; font-weight: 700; background: rgba(255,255,255,0.06); border: 1px solid var(--pra-blue); border-radius: 5px; color: #fff; text-align: center; padding: 2px 4px; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pra-bg"></div>
  <script src="/nav.js"></script>
  <script src="/chat-app/chat-header.js"></script>
  <div class="wrap">
    <div class="pra-panel profile-card" id="profileCard">Loading…</div>
  </div>
</div>

<script>
let me = null, viewingUser = null;
const params = new URLSearchParams(location.search);
const viewUserId = params.get('userId');

async function load() {
  const meRes = await fetch('/api/auth/me');
  if (!meRes.ok) { location.href = '/chat-app/login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
  me = (await meRes.json()).user;

  if (viewUserId && viewUserId !== me.id) {
    const r = await fetch('/api/chat/users/' + viewUserId);
    if (r.ok) viewingUser = (await r.json()).user;
  }
  const target = viewingUser || me;
  // Location + training personality live on the sheet-backed profile card,
  // not the local account record — layer them onto whichever user we're
  // rendering (self or someone else).
  const cardRes = await fetch('/api/chat/profile/' + target.id);
  if (cardRes.ok) {
    const { profile } = await cardRes.json();
    target.location = profile.location;
    target.archetypeImage = profile.archetypeImage;
    target.archetypeTitle = profile.archetypeTitle;
    target.gender = profile.gender;
  }
  render(target, !viewingUser);
}

function initials(u) { return ((u.first?.[0]||'') + (u.last?.[0]||'')).toUpperCase(); }
function avatarHtml(u) {
  return u.profilePictureFileId
    ? '<img src="/api/chat/media/' + u.profilePictureFileId + '"/>'
    : initials(u);
}
// Same slug rule the quiz itself uses to build its own results.html link
// (personality-quiz/index.html's slugify) — lowercase, alphanumeric only.
function slugify(title) { return String(title || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function archetypeUrl(title, gender) {
  return `/personality-quiz/results.html?title=${encodeURIComponent(slugify(title))}&gender=${encodeURIComponent(gender || 'male')}`;
}

function locationText(u) {
  return u.location ? [u.location.city, u.location.region, u.location.country].filter(Boolean).join(', ') : '';
}

function render(u, editable) {
  const card = document.getElementById('profileCard');
  card.innerHTML = `
    <div class="avatar-wrap">
      <div class="pra-avatar avatar-lg role-${u.role}${(u.role === 'online' || u.role === 'gym') ? '-solo' : ''}">${avatarHtml(u)}</div>
      ${editable ? `
        <div class="avatar-edit-badge" id="avatarEditBadge" title="Change profile photo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 7l4 4" stroke="#009bff" stroke-width="1.6"/></svg></div>
        <input type="file" id="picInput" accept="image/*" style="display:none"/>
      ` : ''}
    </div>
    <div class="pra-h1">${u.first} ${u.last}</div>
    <div class="pra-badge role-badge">${u.role}</div>

    ${u.archetypeTitle ? `
    <div class="section-title" style="border-top:none;padding-top:0;margin-top:20px">Training Personality</div>
    <a class="archetype-link" href="${archetypeUrl(u.archetypeTitle, u.gender)}">
      <div class="level-chip" style="max-width:none">
        <span class="cat" style="flex:none">${u.archetypeTitle}</span>
        ${u.archetypeImage ? `<img src="${u.archetypeImage}" style="width:32px;height:32px;border-radius:7px;object-fit:cover;margin-left:auto"/>` : ''}
      </div>
    </a>
    ` : ''}

    <div class="section-title" style="${u.archetypeTitle ? '' : 'border-top:none;padding-top:0;'}margin-top:20px">My Levels</div>
    <div id="levelsSection"><div class="pra-muted" style="font-size:.82rem;text-align:left">Loading…</div></div>

    <div class="fields">
      <div class="field"><label class="pra-label">Email</label>
        <input class="pra-input" value="${u.email}" disabled/></div>
      <div class="field"><label class="pra-label">First Name</label>
        <input class="pra-input" id="fFirst" value="${u.first}" ${editable ? '' : 'disabled'}/></div>
      <div class="field"><label class="pra-label">Last Name</label>
        <input class="pra-input" id="fLast" value="${u.last}" ${editable ? '' : 'disabled'}/></div>
      <div class="field"><label class="pra-label">Phone</label>
        <input class="pra-input" id="fPhone" value="${u.phone||''}" ${editable ? '' : 'disabled'}/></div>
      <div class="field"><label class="pra-label">Location</label>
        <input class="pra-input" id="fLocation" placeholder="City, State/Region, Country" value="${locationText(u)}" ${editable ? '' : 'disabled'}/></div>
      ${u.role !== 'user' ? `
      <div class="field"><label class="pra-label">Zoom Link</label>
        <input class="pra-input" id="fZoomLink" placeholder="https://zoom.us/j/..." value="${u.zoomLink||''}" ${editable ? '' : 'disabled'}/></div>
      ` : ''}
    </div>
    ${editable ? '<div class="save-msg" id="locationMsg"></div>' : ''}
    ${editable ? `
      <div class="btn-row">
        <button class="pra-btn" id="saveBtn" style="flex:1">SAVE CHANGES</button>
        <button class="pra-btn pra-btn-ghost" id="logoutBtn">LOG OUT</button>
      </div>

      <div class="section-title">Change Password</div>
      <div class="field"><label class="pra-label">Current Password</label>
        <input class="pra-input" type="password" id="fCurrentPw" autocomplete="current-password"/></div>
      <div class="field"><label class="pra-label">New Password</label>
        <input class="pra-input" type="password" id="fNewPw" autocomplete="new-password"/></div>
      <div class="field"><label class="pra-label">Confirm New Password</label>
        <input class="pra-input" type="password" id="fConfirmPw" autocomplete="new-password"/></div>
      <button class="pra-btn pra-btn-outline" id="changePwBtn" style="width:100%">CHANGE PASSWORD</button>
      <div class="save-msg" id="pwMsg"></div>
    ` : `<div class="btn-row"><a class="pra-btn" style="flex:1;text-decoration:none;text-align:center" href="/chat-app/chat.html">MESSAGE</a></div>`}
  `;

  if (editable) {
    document.getElementById('avatarEditBadge').onclick = () => document.getElementById('picInput').click();
    document.getElementById('picInput').onchange = uploadPhotoNow;
    document.getElementById('saveBtn').onclick = save;
    document.getElementById('logoutBtn').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST' }); location.href = '/chat-app/login.html'; };
    document.getElementById('changePwBtn').onclick = changePassword;
  }
  loadLevels(u, editable);
}

const LEVELS_CATS = ["NINJA STRENGTH", "HANDSTAND", "POWERMOVES", "FREERUN", "CIRQUE"];
const LEVEL_NUM_COLORS = { 1: '#ffffff', 2: '#ffd700', 3: '#cd7f32', 4: '#22c55e', 5: '#3b82f6', 6: '#a855f7', 7: '#ef4444', 8: '#d1d5db', 9: '#9a9aa5', 10: '#009bff' };
function catLabel(c) { return c.toLowerCase().replace(/(^|\s)\S/g, t => t.toUpperCase()); }
function isChecked(v) { return ["x", "yes"].includes(String(v || "").trim().toLowerCase()); }
function levelNumColor(n) { return LEVEL_NUM_COLORS[Number(n)] || '#5f727f'; }
// Completing Foundation means they've at least started every skill — an
// unrecorded category reads as Level 1, not 0, once Foundation is done.
function effectiveLevel(e, cat) {
  const raw = Number(e.levels[cat]) || 0;
  if (raw > 0) return raw;
  return isChecked(e.levels['FOUNDATION']) ? 1 : 0;
}

function isStaffMe() { return !!me && (me.role === 'coach' || me.role === 'admin' || me.role === 'admin2'); }

// Editable only for a coach/admin viewing their OWN profile (editable is
// true there) -- a student's levels are still only ever set by a coach,
// from chat. Same backend contract (/api/chat/levels/update) and the same
// click-a-chip-to-edit interaction as chat.html's Levels popup
// (attachLevelsChipHandlers) and levels.html, just rendered into this
// page's plain single-column chip list instead of that modal's grid.
let profileLevelsUser = null;
let profileLevelsEntries = [];
let profileLevelsCanEdit = false;

async function loadLevels(u, editable) {
  profileLevelsUser = u;
  profileLevelsCanEdit = !!editable && isStaffMe();
  const r = await fetch('/api/chat/levels/lookup?first=' + encodeURIComponent(u.first) + '&last=' + encodeURIComponent(u.last));
  const d = await r.json();
  // A real entry always has a program ('Gym'/'Online') -- the backend
  // requires one to save against. The no-entries-yet placeholder used for
  // read-only display has program:null and must never be rendered as
  // editable (clicking a chip on it 400s -- "program must be 'Gym' or
  // 'Online'"); a coach/admin with no entry yet gets "+ Add" buttons
  // instead (see renderLevels), same as chat.html's Levels popup.
  profileLevelsEntries = d.entries && d.entries.length ? d.entries : (profileLevelsCanEdit ? [] : [{ program: null, levels: {}, team: false }]);
  renderLevels();
}

function renderLevels() {
  const box = document.getElementById('levelsSection');
  const editCls = profileLevelsCanEdit ? ' editable' : '';
  const chipsHtml = profileLevelsEntries.map((e, idx) => `
    <div class="levels-col">
      <div class="level-chip"><span class="cat">Foundation</span><span class="chip-val${editCls}" data-idx="${idx}" data-cat="FOUNDATION" style="color:#fff">${isChecked(e.levels['FOUNDATION']) ? '✓' : (String(e.levels['FOUNDATION'] || '').trim().toLowerCase() === 'in progress' ? 'In Progress' : '0')}</span></div>
      ${LEVELS_CATS.map(cat => {
        const n = effectiveLevel(e, cat);
        return `<div class="level-chip"><span class="cat">${catLabel(cat)}</span><span class="chip-val${editCls}" data-idx="${idx}" data-cat="${cat}"><span style="color:${levelNumColor(n)}">${n}</span><span style="color:#009bff">/10</span></span></div>`;
      }).join('')}
      ${e.program === 'Gym' ? `<div class="level-chip"><span class="cat">Team</span><span class="chip-val${editCls}" data-idx="${idx}" data-cat="TEAM" style="color:#fff">${e.team ? '✓' : '0'}</span></div>` : ''}
    </div>
  `).join('');
  const missingPrograms = profileLevelsCanEdit ? ['Gym', 'Online'].filter(p => !profileLevelsEntries.some(e => e.program === p)) : [];
  const addButtonsHtml = missingPrograms.map(p =>
    `<button class="pra-btn pra-btn-ghost add-level-program-btn" data-program="${p}" style="width:100%;margin-top:8px;font-size:.8rem">+ Add ${p} Levels</button>`
  ).join('');
  box.innerHTML = chipsHtml + addButtonsHtml;
  if (profileLevelsCanEdit) {
    attachProfileLevelsHandlers();
    box.querySelectorAll('.add-level-program-btn').forEach(btn => {
      btn.onclick = () => {
        profileLevelsEntries.push({ program: btn.dataset.program, team: false, levels: {} });
        renderLevels();
      };
    });
  }
}

async function saveProfileLevelsField(idx, cat, value) {
  const e = profileLevelsEntries[idx];
  const levels = { ...e.levels };
  if (cat === 'TEAM') e.team = value;
  else levels[cat] = value;
  const r = await fetch('/api/chat/levels/update', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ first: profileLevelsUser.first, last: profileLevelsUser.last, program: e.program, levels, team: e.team }),
  });
  if (!r.ok) return false;
  e.levels = levels;
  return true;
}

function attachProfileLevelsHandlers() {
  document.querySelectorAll('#levelsSection .chip-val.editable').forEach(el => {
    el.addEventListener('click', async () => {
      const idx = Number(el.dataset.idx);
      const cat = el.dataset.cat;
      const e = profileLevelsEntries[idx];
      if (!e) return;

      if (cat === 'FOUNDATION' || cat === 'TEAM') {
        const current = cat === 'TEAM' ? !!e.team : isChecked(e.levels['FOUNDATION']);
        const next = cat === 'TEAM' ? !current : (current ? '' : (e.program === 'Online' ? 'Yes' : 'X'));
        el.style.opacity = '.5';
        const ok = await saveProfileLevelsField(idx, cat, next);
        el.style.opacity = '';
        if (ok) renderLevels();
        return;
      }

      const current = effectiveLevel(e, cat);
      const input = document.createElement('input');
      input.type = 'number'; input.min = '0'; input.max = '10';
      input.value = current;
      input.className = 'chip-val-input';
      el.replaceWith(input);
      input.focus(); input.select();

      const commit = async () => {
        const val = Math.max(0, Math.min(10, Number(input.value) || 0));
        await saveProfileLevelsField(idx, cat, String(val));
        renderLevels();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') input.blur();
        if (ev.key === 'Escape') { input.removeEventListener('blur', commit); renderLevels(); }
      });
    });
  });
}

async function changePassword() {
  const msg = document.getElementById('pwMsg');
  const currentPassword = document.getElementById('fCurrentPw').value;
  const newPassword = document.getElementById('fNewPw').value;
  const confirm = document.getElementById('fConfirmPw').value;
  if (newPassword.length < 8) { msg.textContent = 'New password must be at least 8 characters.'; return; }
  if (newPassword !== confirm) { msg.textContent = "New passwords don't match."; return; }
  const r = await fetch('/api/auth/change-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ currentPassword, newPassword }),
  });
  const d = await r.json();
  if (!r.ok) { msg.textContent = d.error || 'Failed to change password.'; return; }
  msg.textContent = 'Password changed.';
  document.getElementById('fCurrentPw').value = '';
  document.getElementById('fNewPw').value = '';
  document.getElementById('fConfirmPw').value = '';
}

async function save() {
  const fd = new FormData();
  fd.append('first', document.getElementById('fFirst').value);
  fd.append('last', document.getElementById('fLast').value);
  fd.append('phone', document.getElementById('fPhone').value);
  fd.append('location', document.getElementById('fLocation').value);
  const zoomLinkEl = document.getElementById('fZoomLink');
  if (zoomLinkEl) fd.append('zoomLink', zoomLinkEl.value);
  const r = await fetch('/api/auth/update-profile', { method: 'POST', body: fd });
  if (!r.ok) return;
  const d = await r.json();
  // update-profile returns the bare account record, not the sheet-derived
  // location/archetype card — re-run load() so a saved location re-geocodes
  // and shows immediately instead of reverting to the pre-save value.
  await load();
  if (d.locationError) {
    const msg = document.getElementById('locationMsg');
    if (msg) msg.textContent = d.locationError;
  }
}

// Clicking the edit badge on the avatar uploads immediately (no waiting on
// the general Save Changes button below) — picking a photo IS the action,
// same as tapping a profile pic in any other app.
async function uploadPhotoNow() {
  const pic = document.getElementById('picInput').files[0];
  if (!pic) return;
  const fd = new FormData();
  fd.append('profilePicture', pic);
  await fetch('/api/auth/update-profile', { method: 'POST', body: fd });
  await load();
}

load();
</script>
</body>
</html>
