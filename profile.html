<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Profile — PRA Chat</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  body { margin: 0; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; }
  .profile-card { padding: 32px; text-align: center; }
  .avatar-lg { width: 100px; height: 100px; margin: 0 auto 16px; font-size: 2.2rem; }
  .avatar-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .role-badge { margin-top: 8px; }
  .fields { text-align: left; margin-top: 26px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; margin-bottom: 6px; }
  .btn-row { display: flex; gap: 10px; margin-top: 22px; }
  #uploadLabel { display: block; margin-top: 10px; cursor: pointer; }
  .section-title { text-align: left; font-weight: 700; font-size: .95rem; margin: 28px 0 12px; padding-top: 20px; border-top: 1px solid var(--pra-border); }
  .save-msg { text-align: left; font-size: .78rem; color: var(--pra-blue); margin-top: 8px; min-height: 1em; }
  .levels-col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .level-chip { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--pra-border); border-radius: 8px; padding: 6px 12px; font-size: .8rem; width: 100%; max-width: 280px; }
  .level-chip .cat { font-family: var(--font-secondary); font-size: .68rem; color: var(--pra-dim); text-transform: uppercase; letter-spacing: .04em; flex: 1; }
  .level-chip .chip-val { font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pra-bg"></div>
  <script src="/nav.js"></script>
  <script src="/chat-app/chat-header.js"></script>
  <div class="wrap">
    <div class="pra-panel profile-card" id="profileCard">Loading…</div>
  </div>
</div>

<script>
let me = null, viewingUser = null;
const params = new URLSearchParams(location.search);
const viewUserId = params.get('userId');

async function load() {
  const meRes = await fetch('/api/auth/me');
  if (!meRes.ok) { location.href = '/chat-app/login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
  me = (await meRes.json()).user;

  if (viewUserId && viewUserId !== me.id) {
    const r = await fetch('/api/chat/users/' + viewUserId);
    if (r.ok) viewingUser = (await r.json()).user;
  }
  const target = viewingUser || me;
  // Location + training personality live on the sheet-backed profile card,
  // not the local account record — layer them onto whichever user we're
  // rendering (self or someone else).
  const cardRes = await fetch('/api/chat/profile/' + target.id);
  if (cardRes.ok) {
    const { profile } = await cardRes.json();
    target.location = profile.location;
    target.archetypeImage = profile.archetypeImage;
    target.archetypeTitle = profile.archetypeTitle;
  }
  render(target, !viewingUser);
}

function initials(u) { return ((u.first?.[0]||'') + (u.last?.[0]||'')).toUpperCase(); }
function avatarHtml(u) {
  return u.profilePictureFileId
    ? '<img src="/api/chat/media/' + u.profilePictureFileId + '"/>'
    : initials(u);
}

function locationText(u) {
  return u.location ? [u.location.city, u.location.region, u.location.country].filter(Boolean).join(', ') : '';
}

function render(u, editable) {
  const card = document.getElementById('profileCard');
  card.innerHTML = `
    <div class="pra-avatar avatar-lg role-${u.role}">${avatarHtml(u)}</div>
    <div class="pra-h1">${u.first} ${u.last}</div>
    <div class="pra-badge role-badge">${u.role}</div>

    ${u.archetypeTitle ? `
    <div class="section-title" style="border-top:none;padding-top:0;margin-top:20px">Training Personality</div>
    <div class="level-chip" style="max-width:none">
      <span class="cat" style="flex:none">${u.archetypeTitle}</span>
      ${u.archetypeImage ? `<img src="${u.archetypeImage}" style="width:32px;height:32px;border-radius:7px;object-fit:cover;margin-left:auto"/>` : ''}
    </div>
    ` : ''}

    <div class="section-title" style="${u.archetypeTitle ? '' : 'border-top:none;padding-top:0;'}margin-top:20px">My Levels</div>
    <div id="levelsSection"><div class="pra-muted" style="font-size:.82rem;text-align:left">Loading…</div></div>

    <div class="fields">
      <div class="field"><label class="pra-label">Email</label>
        <input class="pra-input" value="${u.email}" disabled/></div>
      <div class="field"><label class="pra-label">First Name</label>
        <input class="pra-input" id="fFirst" value="${u.first}" ${editable ? '' : 'disabled'}/></div>
      <div class="field"><label class="pra-label">Last Name</label>
        <input class="pra-input" id="fLast" value="${u.last}" ${editable ? '' : 'disabled'}/></div>
      <div class="field"><label class="pra-label">Phone</label>
        <input class="pra-input" id="fPhone" value="${u.phone||''}" ${editable ? '' : 'disabled'}/></div>
      <div class="field"><label class="pra-label">Location</label>
        <input class="pra-input" id="fLocation" placeholder="City, State/Region, Country" value="${locationText(u)}" ${editable ? '' : 'disabled'}/></div>
      ${u.role !== 'user' ? `
      <div class="field"><label class="pra-label">Zoom Link</label>
        <input class="pra-input" id="fZoomLink" placeholder="https://zoom.us/j/..." value="${u.zoomLink||''}" ${editable ? '' : 'disabled'}/></div>
      ` : ''}
      ${editable ? `
        <label id="uploadLabel" class="pra-link">Change profile photo</label>
        <input type="file" id="picInput" accept="image/*" style="display:none"/>
      ` : ''}
    </div>
    ${editable ? '<div class="save-msg" id="locationMsg"></div>' : ''}
    ${editable ? `
      <div class="btn-row">
        <button class="pra-btn" id="saveBtn" style="flex:1">SAVE CHANGES</button>
        <button class="pra-btn pra-btn-ghost" id="logoutBtn">LOG OUT</button>
      </div>

      <div class="section-title">Change Password</div>
      <div class="field"><label class="pra-label">Current Password</label>
        <input class="pra-input" type="password" id="fCurrentPw" autocomplete="current-password"/></div>
      <div class="field"><label class="pra-label">New Password</label>
        <input class="pra-input" type="password" id="fNewPw" autocomplete="new-password"/></div>
      <div class="field"><label class="pra-label">Confirm New Password</label>
        <input class="pra-input" type="password" id="fConfirmPw" autocomplete="new-password"/></div>
      <button class="pra-btn pra-btn-outline" id="changePwBtn" style="width:100%">CHANGE PASSWORD</button>
      <div class="save-msg" id="pwMsg"></div>
    ` : `<div class="btn-row"><a class="pra-btn" style="flex:1;text-decoration:none;text-align:center" href="/chat-app/chat.html">MESSAGE</a></div>`}
  `;

  if (editable) {
    document.getElementById('uploadLabel').onclick = () => document.getElementById('picInput').click();
    document.getElementById('saveBtn').onclick = save;
    document.getElementById('logoutBtn').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST' }); location.href = '/chat-app/login.html'; };
    document.getElementById('changePwBtn').onclick = changePassword;
  }
  loadLevels(u);
}

const LEVELS_CATS = ["NINJA STRENGTH", "HANDSTAND", "POWERMOVES", "FREERUN", "CIRQUE"];
const LEVEL_NUM_COLORS = { 1: '#ffffff', 2: '#ffd700', 3: '#cd7f32', 4: '#22c55e', 5: '#3b82f6', 6: '#a855f7', 7: '#ef4444', 8: '#d1d5db', 9: '#9a9aa5', 10: '#009bff' };
function catLabel(c) { return c.toLowerCase().replace(/(^|\s)\S/g, t => t.toUpperCase()); }
function isChecked(v) { return ["x", "yes"].includes(String(v || "").trim().toLowerCase()); }
function levelNumColor(n) { return LEVEL_NUM_COLORS[Number(n)] || '#5f727f'; }
// Completing Foundation means they've at least started every skill — an
// unrecorded category reads as Level 1, not 0, once Foundation is done.
function effectiveLevel(e, cat) {
  const raw = Number(e.levels[cat]) || 0;
  if (raw > 0) return raw;
  return isChecked(e.levels['FOUNDATION']) ? 1 : 0;
}

// Read-only — levels are only ever edited by a coach, from chat.
async function loadLevels(u) {
  const box = document.getElementById('levelsSection');
  const r = await fetch('/api/chat/levels/lookup?first=' + encodeURIComponent(u.first) + '&last=' + encodeURIComponent(u.last));
  const d = await r.json();
  const entries = d.entries && d.entries.length ? d.entries : [{ program: null, levels: {}, team: false }];
  box.innerHTML = entries.map(e => `
    <div class="levels-col">
      <div class="level-chip"><span class="cat">Foundation</span><span class="chip-val" style="color:#fff">${isChecked(e.levels['FOUNDATION']) ? '✓' : (String(e.levels['FOUNDATION'] || '').trim().toLowerCase() === 'in progress' ? 'In Progress' : '0')}</span></div>
      ${LEVELS_CATS.map(cat => {
        const n = effectiveLevel(e, cat);
        return `<div class="level-chip"><span class="cat">${catLabel(cat)}</span><span class="chip-val"><span style="color:${levelNumColor(n)}">${n}</span><span style="color:#009bff">/10</span></span></div>`;
      }).join('')}
      ${e.program === 'Gym' ? `<div class="level-chip"><span class="cat">Team</span><span class="chip-val" style="color:#fff">${e.team ? '✓' : '0'}</span></div>` : ''}
    </div>
  `).join('');
}

async function changePassword() {
  const msg = document.getElementById('pwMsg');
  const currentPassword = document.getElementById('fCurrentPw').value;
  const newPassword = document.getElementById('fNewPw').value;
  const confirm = document.getElementById('fConfirmPw').value;
  if (newPassword.length < 8) { msg.textContent = 'New password must be at least 8 characters.'; return; }
  if (newPassword !== confirm) { msg.textContent = "New passwords don't match."; return; }
  const r = await fetch('/api/auth/change-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ currentPassword, newPassword }),
  });
  const d = await r.json();
  if (!r.ok) { msg.textContent = d.error || 'Failed to change password.'; return; }
  msg.textContent = 'Password changed.';
  document.getElementById('fCurrentPw').value = '';
  document.getElementById('fNewPw').value = '';
  document.getElementById('fConfirmPw').value = '';
}

async function save() {
  const fd = new FormData();
  fd.append('first', document.getElementById('fFirst').value);
  fd.append('last', document.getElementById('fLast').value);
  fd.append('phone', document.getElementById('fPhone').value);
  fd.append('location', document.getElementById('fLocation').value);
  const zoomLinkEl = document.getElementById('fZoomLink');
  if (zoomLinkEl) fd.append('zoomLink', zoomLinkEl.value);
  const pic = document.getElementById('picInput').files[0];
  if (pic) fd.append('profilePicture', pic);
  const r = await fetch('/api/auth/update-profile', { method: 'POST', body: fd });
  if (!r.ok) return;
  const d = await r.json();
  // update-profile returns the bare account record, not the sheet-derived
  // location/archetype card — re-run load() so a saved location re-geocodes
  // and shows immediately instead of reverting to the pre-save value.
  await load();
  if (d.locationError) {
    const msg = document.getElementById('locationMsg');
    if (msg) msg.textContent = d.locationError;
  }
}

load();
</script>
</body>
</html>
