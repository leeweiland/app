<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — PRA Chat</title>
<link rel="stylesheet" href="/pra-design-system.css"/>
<style>
  body { margin: 0; }
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 400px; padding: 36px 32px; text-align: center; }
  .field { margin-bottom: 14px; text-align: left; }
  .err-msg { color: #ff5c5c; font-size: .82rem; margin: 4px 0 14px; min-height: 1em; font-family: var(--font-secondary); }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pra-bg"></div>
  <script src="/nav.js"></script>
  <div class="auth-wrap">
    <div class="pra-panel auth-card">
      <div class="pra-h1 pra-glow" style="margin-bottom:22px">RESET PASSWORD</div>
      <div id="content">
        <form id="resetForm">
          <div class="field"><label class="pra-label">New Password</label><br/>
            <input class="pra-input" type="password" id="newPassword" minlength="8" required style="margin-top:6px"/></div>
          <div class="field"><label class="pra-label">Confirm Password</label><br/>
            <input class="pra-input" type="password" id="confirmPassword" minlength="8" required style="margin-top:6px"/></div>
          <div class="err-msg" id="errMsg"></div>
          <button class="pra-btn" type="submit" style="width:100%">SET NEW PASSWORD</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
const content = document.getElementById('content');

if (!token) {
  content.innerHTML = '<div class="pra-muted">This reset link is missing its token. Request a new one from the <a class="pra-link" href="/login.html">sign-in page</a>.</div>';
} else {
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errMsg = document.getElementById('errMsg');
    errMsg.textContent = '';
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword !== confirmPassword) { errMsg.textContent = "Passwords don't match"; return; }
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword }),
    });
    const d = await r.json();
    if (!r.ok) { errMsg.textContent = d.error || 'Something went wrong'; return; }
    content.innerHTML = '<div class="pra-muted" style="margin-bottom:16px">Password updated.</div><a class="pra-btn" style="text-decoration:none;display:block" href="/login.html">SIGN IN</a>';
  });
}
</script>
</body>
</html>
