<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Retreats — PRA</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .pra-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .frame-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .frame-head { padding: 14px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--pra-border); }
  .frame-head .pra-h2 { flex: 1; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: #000; }
  .frame-wrap { position: relative; }
  .fallback { display: none; position: absolute; left: 12px; right: 12px; bottom: 12px; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(13,13,17,.92); border: 1px solid var(--pra-border); }
  .fallback.show { display: flex; }
  /* The website draws its normal header/menu/promo first and only then its
     app mode hides them -- that flashed a different layout. The frame stays
     hidden behind this cover until it has loaded and settled. */
  iframe.pending { visibility: hidden; }
  .frame-cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--pra-black, #0b0b0f); color: var(--pra-dim); font-family: var(--font-secondary, sans-serif); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; transition: opacity .25s; }
  .frame-cover.gone { opacity: 0; pointer-events: none; }
  .frame-cover i { width: 7px; height: 7px; border-radius: 50%; background: var(--pra-blue, #009bff); animation: fcDot 1s infinite ease-in-out; }
  .frame-cover i:nth-child(3) { animation-delay: .15s; } .frame-cover i:nth-child(4) { animation-delay: .3s; }
  @keyframes fcDot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
</style>
</head>
<body>
<div class="pra-root">
  <script src="/nav.js"></script>
  <script src="/chat-app/chat-header.js"></script>
  <div class="frame-wrap">
    <!-- ?app=1 = the website's app mode: no site logo, menu, promo bar or footer. -->
    <iframe class="pending" id="retreatsFrame" src="https://www.pacificrimathletics.com/retreats?app=1" title="Pacific Rim Athletics Retreats" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="frame-cover" id="frameCover"><span>Loading</span><i></i><i></i><i></i></div>
    <div class="fallback" id="fallback">
      <div class="pra-muted" style="font-size:.8rem">Still loading…</div>
      <a class="pra-btn" href="https://www.pacificrimathletics.com/retreats" target="_blank" rel="noopener" style="text-decoration:none;padding:8px 14px;font-size:.75rem">Open Retreats ↗</a>
    </div>
  </div>
</div>
<script>
  // Never hide the page: on phones the website can take well over 4s to
  // finish loading (video, animations), and the old 4s cutoff swapped it for
  // a "can't be shown here" screen. If it still hasn't loaded after 15s, just
  // offer a small "open in browser" link on top — the page stays visible.
  const frame = document.querySelector('iframe');
  let loaded = false;
  // Shown once loaded + a beat for the site's app mode to finish hiding its
  // own header/menu (or after 10s no matter what, so a slow phone still sees it).
  const reveal = () => { frame.classList.remove('pending'); document.getElementById('frameCover').classList.add('gone'); };
  frame.addEventListener('load', () => { loaded = true; document.getElementById('fallback').classList.remove('show'); setTimeout(reveal, 900); });
  setTimeout(reveal, 10000);
  setTimeout(() => { if (!loaded) document.getElementById('fallback').classList.add('show'); }, 15000);
</script>
</body>
</html>
