<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shop — PRA</title>
<link rel="stylesheet" href="/pra-design-system.css"/>
<style>
  body { margin: 0; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 60px 20px; text-align: center; }
  .shop-icon { margin: 0 auto 20px; width: 64px; height: 64px; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pra-bg"></div>
  <script src="/nav.js"></script>
  <script src="/chat-header.js"></script>
  <div class="wrap">
    <svg class="shop-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8.5 4 5 6.5 3 9l2.5 2 1.5-1.3V20h10V9.7L18.5 11 21 9l-2-2.5L15.5 4c-.5 1.7-2 2.8-3.5 2.8S9 5.7 8.5 4Z" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M8.5 4c.5 1.7 2 2.8 3.5 2.8S15 5.7 15.5 4" stroke="#009bff" stroke-width="1.2"/>
    </svg>
    <div class="pra-h1 pra-glow" style="margin-bottom:10px">SHOP</div>
    <div class="pra-muted" style="margin-bottom:26px;font-size:.9rem;line-height:1.5">
      The Pacific Rim Athletics clothing store doesn't allow itself to be shown inside another site
      (a security setting Shopify enforces on every store) — so it opens in its own tab instead.
    </div>
    <a class="pra-btn" href="https://vimfti-ev.myshopify.com/" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;padding:12px 28px">Open the Shop ↗</a>
  </div>
</div>
</body>
</html>
