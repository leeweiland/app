<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Shop — PRA</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .pra-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .frame-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .frame-head { padding: 14px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--pra-border); }
  .frame-head .pra-h2 { flex: 1; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: #000; }
  .frame-wrap { position: relative; }
  .fallback { display: none; position: absolute; left: 12px; right: 12px; bottom: 12px; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(13,13,17,.92); border: 1px solid var(--pra-border); }
  .fallback.show { display: flex; }
</style>
</head>
<body>
<div class="pra-root">
  <script src="/nav.js"></script>
  <script src="/chat-app/chat-header.js"></script>
  <div class="frame-wrap">
    <!-- ?app=1 = the website's app mode: no site logo, menu, promo bar or footer. -->
    <iframe id="shopFrame" src="https://www.pacificrimathletics.com/shop?app=1" title="Pacific Rim Athletics Shop" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="fallback" id="fallback">
      <div class="pra-muted" style="font-size:.8rem">Still loading…</div>
      <a class="pra-btn" href="https://www.pacificrimathletics.com/shop" target="_blank" rel="noopener" style="text-decoration:none;padding:8px 14px;font-size:.75rem">Open the Shop ↗</a>
    </div>
  </div>
</div>
<script>
  // Never hide the page: on phones the website can take well over 4s to
  // finish loading (video, animations), and the old 4s cutoff swapped it for
  // a "can't be shown here" screen. If it still hasn't loaded after 15s, just
  // offer a small "open in browser" link on top — the page stays visible.
  const frame = document.querySelector('iframe');
  let loaded = false;
  frame.addEventListener('load', () => { loaded = true; document.getElementById('fallback').classList.remove('show'); });
  setTimeout(() => { if (!loaded) document.getElementById('fallback').classList.add('show'); }, 15000);
</script>
</body>
</html>
