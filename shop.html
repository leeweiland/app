<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Shop — PRA</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .pra-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .frame-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .frame-head { padding: 14px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--pra-border); }
  .frame-head .pra-h2 { flex: 1; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: #000; }
  .fallback { display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 20px; text-align: center; }
  .fallback.show { display: flex; }
</style>
</head>
<body>
<div class="pra-root">
  <script src="/nav.js"></script>
  <script src="/chat-app/chat-header.js"></script>
  <div class="frame-wrap">
    <!-- ?app=1 = the website's app mode: no site logo, menu, promo bar or footer. -->
    <iframe id="shopFrame" src="https://www.pacificrimathletics.com/shop?app=1" title="Pacific Rim Athletics Shop" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="fallback pra-center" id="fallback">
      <div class="pra-h2">This page can't be embedded here.</div>
      <div class="pra-muted" style="font-size:.85rem;max-width:360px">The shop didn't load here.</div>
      <a class="pra-btn" href="https://www.pacificrimathletics.com/shop" target="_blank" rel="noopener" style="text-decoration:none">Open the Shop ↗</a>
    </div>
  </div>
</div>
<script>
  const frame = document.getElementById('shopFrame');
  let loaded = false;
  frame.addEventListener('load', () => { loaded = true; });
  setTimeout(() => {
    if (!loaded) {
      frame.style.display = 'none';
      document.getElementById('fallback').classList.add('show');
    }
  }, 4000);
</script>
</body>
</html>
