<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Training Protocol — PRA</title>
<link rel="stylesheet" href="/chat-app/pra-design-system.css"/>
<style>
  body { margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
  .icon-btn { width: 34px; height: 34px; flex-shrink: 0; border-radius: 8px; border: 1px solid var(--pra-border); background: transparent; color: var(--pra-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: color .15s, border-color .15s; }
  @media (hover: hover) { .icon-btn:hover { color: var(--pra-blue); border-color: var(--pra-blue); } }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  @media (hover: hover) { .icon-btn:disabled:hover { color: var(--pra-dim); border-color: var(--pra-border); } }
  .protocol-head { display: flex; align-items: center; gap: 12px; }
  .protocol-head-titles { flex: 1; min-width: 0; }
  .client-name { text-align: center; font-size: .95rem; color: var(--pra-dim); margin-bottom: 4px; }
  /* Node-graph canvas — a main horizontal chain of steps (left to right),
     with branches (started below any media step) hanging on their own row
     below the branch point and flowing right with their own steps, same as
     the trunk. Pan/zoom works the same way users-map.html's world does:
     wheel/pinch to zoom toward the cursor/pinch midpoint, drag to pan —
     just implemented as a plain CSS transform on .protocol-world instead of
     an SVG viewBox crop, since the content here is HTML step cards (video/
     image/text), not raw SVG shapes. */
  /* Breaks out of .wrap's max-width/centering to span the full viewport
     width, without the 100vw-includes-scrollbar overflow that trips up —
     the negative margins alone pull both edges out to the viewport edge
     and the block naturally fills the gap between them. */
  .protocol-canvas { position: relative; overflow: hidden; touch-action: none; border-top: 1px solid var(--pra-border); border-bottom: 1px solid var(--pra-border); background: rgba(255,255,255,0.015); height: calc(100vh - 230px); min-height: 440px; margin-top: 24px; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); cursor: grab; }
  .protocol-canvas.dragging { cursor: grabbing; }
  .protocol-world, .protocol-connectors, .protocol-insert-layer { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  .protocol-connectors, .protocol-insert-layer { overflow: visible; pointer-events: none; }
  /* Sits on a connector line's midpoint — inserts a new step spliced
     between the two steps that line already connects. */
  /* The + mark is drawn from two CSS bars rather than a text glyph — a
     font's "+" character isn't reliably centered in its own box (varies
     by font/rendering engine), which read as the whole button sitting
     off-center from the connector line it's supposed to be centered on.
     Absolutely-positioned bars at exactly 50%/50% can't have that problem. */
  .step-insert-plus { position: absolute; pointer-events: auto; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--pra-blue); cursor: pointer; transition: background .15s; }
  .step-insert-plus::before, .step-insert-plus::after { content: ''; position: absolute; top: 50%; left: 50%; background: #fff; transform: translate(-50%, -50%); }
  .step-insert-plus::before { width: 10px; height: 2px; }
  .step-insert-plus::after { width: 2px; height: 10px; }
  .step-insert-plus:hover { background: #0086dd; }
  .step-node { position: absolute; width: 260px; }
  .step-card { padding: 14px 16px; position: relative; }
  .step-day-badge { text-align: center; font-family: var(--font-secondary); font-size: 1.3rem; font-weight: 700; color: var(--pra-blue); padding: 6px 0; }
  .step-type { font-family: var(--font-secondary); font-size: .65rem; letter-spacing: .06em; text-transform: uppercase; color: var(--pra-dim); margin-bottom: 8px; }
  .step-card video, .step-card img { width: 100%; border-radius: 8px; display: block; background: #000; }
  .step-card .step-text { font-size: .88rem; line-height: 1.5; white-space: pre-wrap; max-height: 140px; overflow-y: auto; }
  .step-delete { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--pra-border); background: rgba(16,16,20,0.75); color: var(--pra-dim); cursor: pointer; font-size: 12px; z-index: 2; }
  .step-edit { position: absolute; top: 8px; right: 38px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--pra-border); background: rgba(16,16,20,0.75); color: var(--pra-dim); cursor: pointer; font-size: 12px; z-index: 2; }
  .step-edit:hover { border-color: var(--pra-blue); color: var(--pra-blue); }
  /* Grabbing anywhere else on a card pans the canvas (see setupCanvasPanZoom)
     — this handle is the one spot on a card that picks the step up to move
     it instead, so the two gestures never fight each other. */
  .step-drag-handle { position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--pra-border); background: rgba(16,16,20,0.75); color: var(--pra-dim); cursor: grab; font-size: 13px; z-index: 2; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .step-drag-handle:hover { border-color: var(--pra-blue); color: var(--pra-blue); }
  .step-drag-ghost { position: fixed; z-index: 500; pointer-events: none; padding: 8px 14px; border-radius: 10px; background: var(--pra-blue); color: #fff; font-size: .8rem; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,0.5); transform: translate(-50%, -50%); opacity: .95; }
  .drop-target-hover { transform: translate(-50%, -50%) scale(1.6) !important; box-shadow: 0 0 0 4px rgba(0,155,255,0.35); }
  .step-delete:hover { border-color: #ff3b3b; color: #ff3b3b; }
  .step-plus { position: absolute; width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--pra-blue); color: #fff; cursor: pointer; font-size: 1rem; line-height: 1; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .step-plus:hover { background: #0086dd; }
  .step-plus-right { top: 50%; left: 100%; margin-left: 16px; transform: translateY(-50%); }
  .step-plus-below { top: 100%; left: 50%; margin-top: 16px; transform: translateX(-50%); }
  /* An empty, not-yet-filled branch slot — just a + in its reserved spot,
     centered under whichever step it branches off of, no card chrome. */
  .step-node-placeholder { width: 44px; }
  .step-placeholder { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--pra-blue); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.3rem; transition: background .15s; }
  .step-placeholder:hover { background: #0086dd; }
  .step-placeholder-delete { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--pra-border); background: rgba(16,16,20,0.9); color: var(--pra-dim); font-size: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .step-placeholder-delete:hover { border-color: #ff3b3b; color: #ff3b3b; }
  .empty-hint { text-align: center; color: var(--pra-dim); font-size: .88rem; margin-top: 30px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-backdrop.show { display: flex; }
  /* display:flex column + the search-results div being the one flexible,
     independently-scrolling child (.modal-scroll-body) — rather than the
     whole box scrolling as one unit — keeps the Cancel button always
     reachable. It used to be the last thing in that single scroll region,
     which an infinite-scrolling results list (hundreds of video thumbnails)
     could push arbitrarily far below the viewport. */
  .modal-box { width: 100%; max-width: 420px; max-height: 80vh; overflow: hidden; padding: 22px; display: flex; flex-direction: column; }
  .modal-scroll-body { overflow-y: auto; flex: 1; min-height: 0; }
  .type-choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .type-choice { padding: 16px 8px; text-align: center; border-radius: 10px; border: 1px solid var(--pra-border); cursor: pointer; background: rgba(255,255,255,0.02); font-size: .85rem; }
  .type-choice:hover { border-color: var(--pra-blue); }
  .type-choice svg { width: 26px; height: 26px; display: block; margin: 0 auto 8px; overflow: visible; filter: drop-shadow(0 0 3px rgba(255,255,255,.7)); }
  .type-choice:hover svg { filter: drop-shadow(0 0 5px rgba(0,155,255,.9)) drop-shadow(0 0 3px rgba(255,255,255,.9)); }
  /* Grid of bigger cards (matching Powerbatics Training Videos' look) —
     ~2 per row inside the modal's 420px width lands close to 6 visible
     before scrolling, same as moves-dictionary.html's move-thumb. Each
     thumb only gets its real `src` once scrolled into view (see
     wireLazyThumbs in the script below) instead of every result on the
     page trying to load its video at once. */
  .video-results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .video-result { cursor: pointer; border-radius: 8px; overflow: hidden; }
  .video-result-thumb { position: relative; width: 100%; aspect-ratio: 16/10; background: #000; border-radius: 8px; overflow: hidden; }
  .video-result-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .video-result-thumb .play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--pra-blue); filter: drop-shadow(0 0 6px var(--pra-blue-glow)); pointer-events: none; }
  .video-result-name { font-size: .78rem; padding: 6px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .video-results-sentinel { grid-column: 1 / -1; height: 1px; }
  .video-results-loading { grid-column: 1 / -1; text-align: center; font-size: .8rem; padding: 6px 0; }
  .upload-video-link { display: block; text-align: center; margin-top: 12px; font-size: .82rem; color: var(--pra-blue); cursor: pointer; }
  .upload-video-link:hover { text-decoration: underline; }
  #templateResults { max-height: 240px; overflow-y: auto; margin-bottom: 4px; }
  .template-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .template-item:hover { background: rgba(255,255,255,0.05); }
  .template-item-body { flex: 1; min-width: 0; }
  .template-item-title { font-weight: 700; font-size: .85rem; }
  .template-item-text { font-family: var(--font-secondary); font-size: .74rem; color: var(--pra-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .template-delete-btn { flex-shrink: 0; background: none; border: none; color: #ff5c5c; cursor: pointer; font-size: .95rem; padding: 2px 4px; }
  .template-delete-btn:hover { opacity: .7; }
  .template-add-form { border-top: 1px solid var(--pra-border); margin-top: 10px; padding-top: 10px; }
  .template-add-form input, .template-add-form textarea { width: 100%; margin-bottom: 6px; }
  .template-add-form textarea { resize: vertical; min-height: 60px; font-family: inherit; }
</style>
</head>
<body>
<div class="pra-root">
  <div class="pra-bg"></div>
  <script src="/nav.js"></script>
  <script src="/chat-app/chat-header.js"></script>
  <div class="wrap">
    <div class="protocol-head">
      <button class="icon-btn" id="backBtn" title="Back to chat">←</button>
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" disabled>↶</button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Y)" disabled>↷</button>
      <div class="protocol-head-titles">
        <div class="client-name" id="clientName">Loading…</div>
        <div class="pra-h1 pra-glow" style="text-align:center;margin-bottom:0;font-family:var(--font-secondary)">Custom Training Protocol</div>
      </div>
    </div>

    <div class="empty-hint" id="emptyHint" style="display:none">
      No steps yet.
      <div style="margin-top:14px"><button class="pra-btn" id="addFirstStepBtn" style="display:none">+ Add First Step</button></div>
    </div>
    <div class="protocol-canvas" id="protocolCanvas" style="display:none">
      <svg class="protocol-connectors" id="protocolConnectors"></svg>
      <div class="protocol-world" id="protocolWorld"></div>
      <div class="protocol-insert-layer" id="protocolInsertLayer"></div>
    </div>
    <div class="pra-muted" id="uploadStatusMsg" style="font-size:.8rem;margin-top:8px;min-height:1em;text-align:center"></div>
  </div>

  <!-- Step type chooser -->
  <div class="modal-backdrop" id="chooseTypeModal">
    <div class="pra-panel modal-box">
      <div class="pra-h2" style="margin-bottom:14px">Add a Step</div>
      <div class="type-choice-row">
        <div class="type-choice" id="chooseVideo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="5" width="17" height="14" rx="2.2" stroke="#fff" stroke-width="1.6"/><path d="M6.2 5 7.8 8.2M10.6 5l1.6 3.2M15 5l1.6 3.2" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M10.2 10.4v5.2l4.5-2.6-4.5-2.6Z" fill="#009bff"/></svg>Drive Video</div>
        <div class="type-choice" id="chooseUploadVideo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="7" width="17" height="12" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M6.2 7 7.8 4.5M15 7l1.6-2.5" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M12 10.5v5M9.5 12.5l2.5-2.5 2.5 2.5" stroke="#009bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Upload Video</div>
        <div class="type-choice" id="chooseImage"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="5.5" width="14" height="12" rx="2" stroke="#fff" stroke-width="1.6"/><circle cx="8" cy="10" r="1.4" fill="#009bff"/><path d="M5 16l3.2-3.5 2.3 2.3 2.2-2.6L17 16" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/><path d="M19.5 3.5v6M16.8 6.2l2.7-2.7 2.7 2.7" stroke="#009bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Upload Image</div>
        <div class="type-choice" id="chooseText"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="3.5" width="14" height="17" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#009bff" stroke-width="1.5" stroke-linecap="round"/></svg>Text</div>
        <div class="type-choice" id="chooseTemplate"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4.5" y="3.5" width="15" height="17" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><path d="M15.5 14.5l3 3M18.5 14.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke="#009bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Saved Text</div>
        <div class="type-choice" id="chooseDay"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4.5" width="16" height="15" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M4 9h16" stroke="#fff" stroke-width="1.6"/><path d="M8 3v3M16 3v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><text x="12" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#009bff">N</text></svg>Day</div>
      </div>
      <button class="pra-btn pra-btn-ghost" style="margin-top:14px;width:100%" onclick="closeModal('chooseTypeModal')">Cancel</button>
    </div>
  </div>

  <!-- Drive video search -->
  <div class="modal-backdrop" id="videoModal">
    <div class="pra-panel modal-box">
      <div class="pra-h2" style="margin-bottom:14px">Choose a Video</div>
      <input class="pra-input" id="videoSearchInput" placeholder="Search video name…" style="margin-bottom:12px"/>
      <div id="videoResults" class="modal-scroll-body"></div>
      <button class="pra-btn pra-btn-ghost" style="margin-top:14px;width:100%;flex-shrink:0" onclick="closeModal('videoModal')">Cancel</button>
    </div>
  </div>

  <!-- Video upload — no modal; "Upload Video" opens this directly via .click() -->
  <input type="file" id="videoFileInput" accept="video/*" style="display:none"/>

  <!-- Image upload -->
  <div class="modal-backdrop" id="imageModal">
    <div class="pra-panel modal-box">
      <div class="pra-h2" style="margin-bottom:14px">Upload an Image</div>
      <input type="file" id="imageFileInput" accept="image/*" class="pra-input"/>
      <div class="pra-muted" id="imageUploadMsg" style="font-size:.8rem;margin-top:8px;min-height:1em"></div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="pra-btn" id="imageUploadBtn" style="flex:1">Upload</button>
        <button class="pra-btn pra-btn-ghost" onclick="closeModal('imageModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Text step -->
  <div class="modal-backdrop" id="textModal">
    <div class="pra-panel modal-box">
      <div class="pra-h2" style="margin-bottom:14px">Add Text</div>
      <textarea class="pra-textarea" id="textStepInput" rows="6" style="width:100%" placeholder="Write the instructions for this step…"></textarea>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="pra-btn" id="textStepSaveBtn" style="flex:1">Add Step</button>
        <button class="pra-btn pra-btn-ghost" onclick="closeModal('textModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Saved text templates — admin-authored, coach-searchable -->
  <div class="modal-backdrop" id="templateModal">
    <div class="pra-panel modal-box">
      <div class="pra-h2" style="margin-bottom:14px">Saved Text</div>
      <input class="pra-input" id="templateSearchInput" placeholder="Search saved text…" style="margin-bottom:12px"/>
      <div id="templateResults" class="modal-scroll-body"></div>
      <div class="template-add-form" id="templateAddForm" style="display:none;flex-shrink:0">
        <input class="pra-input" id="templateAddTitle" placeholder="Title"/>
        <textarea class="pra-input" id="templateAddText" placeholder="Step text"></textarea>
        <button class="pra-btn" id="templateAddBtn" style="width:100%">Save Template</button>
      </div>
      <button class="pra-btn pra-btn-ghost" style="margin-top:14px;width:100%;flex-shrink:0" onclick="closeModal('templateModal')">Cancel</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const targetUserId = params.get('userId');
const sourceConvoId = params.get('convo');
let me = null, canEdit = false, steps = [];
// Which step (and whether it's a branch) the currently-open "Add a Step"
// modal will attach the next step to — set right before opening it (see
// openAddStepModal), consumed once the type-chooser flow actually commits
// a new step (see commitNewStep).
let pendingStepTarget = null;
// Set right before opening textModal to edit an existing step in place
// instead of the modal's normal "commit a brand new step" behavior — see
// textStepSaveBtn and the .step-edit wiring in render().
let editingStepId = null;
let canvasInitialized = false;

// Undo/redo — every mutation calls snapshotBeforeChange() BEFORE touching
// `steps`, so the stack holds pre-change states to roll back to. Capped so
// a long editing session can't grow this unbounded; redoStack is cleared
// on every fresh change, same as any standard editor (redo only makes
// sense immediately after an undo, not after doing something new).
const MAX_HISTORY = 50;
let undoStack = [], redoStack = [];
function snapshotBeforeChange() {
  undoStack.push(JSON.parse(JSON.stringify(steps)));
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}
function updateUndoRedoButtons() {
  document.getElementById('undoBtn').disabled = !undoStack.length;
  document.getElementById('redoBtn').disabled = !redoStack.length;
}
async function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.parse(JSON.stringify(steps)));
  steps = undoStack.pop();
  updateUndoRedoButtons();
  render();
  await saveSteps();
}
async function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.parse(JSON.stringify(steps)));
  steps = redoStack.pop();
  updateUndoRedoButtons();
  render();
  await saveSteps();
}
document.getElementById('undoBtn').onclick = undo;
document.getElementById('redoBtn').onclick = redo;
document.addEventListener('keydown', (e) => {
  // Don't hijack Ctrl+Z while the user is editing text somewhere (the Add
  // Text textarea, search inputs, etc.) — the browser's own native
  // per-field undo should win there, not a full step-graph rollback.
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const ctrlOrCmd = e.ctrlKey || e.metaKey;
  if (!ctrlOrCmd) return;
  if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
});

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function openModal(id) { document.getElementById(id).classList.add('show'); }
// Click the dark overlay itself (not anything inside the panel) to close
// whichever modal it belongs to — e.currentTarget is always the backdrop
// since this is bound directly on it, so a click that bubbled up from a
// child never matches e.target === e.currentTarget.
document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
  backdrop.addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal(backdrop.id);
  });
});
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function newId() { return 'step_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

async function init() {
  const meRes = await fetch('/api/auth/me');
  if (!meRes.ok) { location.href = '/chat-app/login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
  me = (await meRes.json()).user;

  if (!targetUserId) { document.getElementById('clientName').textContent = 'No client specified.'; return; }

  const uRes = await fetch('/api/chat/users/' + targetUserId);
  const client = uRes.ok ? (await uRes.json()).user : null;
  document.getElementById('clientName').textContent = client ? `${client.first} ${client.last}` : 'Unknown client';

  canEdit = me.role === 'coach' || me.role === 'admin' || me.role === 'admin2';
  document.getElementById('templateAddForm').style.display = (me.role === 'admin' || me.role === 'admin2') ? '' : 'none';

  setupCanvasPanZoom();
  setupStepDrag();
  await loadSteps();
  wireModals();
}

// Older protocols were saved as a flat ordered array with no id/parentId —
// migrate those in place into a single straight chain (no branches) the
// first time they're loaded, so every existing protocol keeps working
// exactly as it looked before, just now expressed in the graph shape the
// rest of this page expects.
function migrateSteps(raw) {
  let prevId = null;
  return raw.map(s => {
    if (s.id) return s;
    const id = newId();
    const migrated = { ...s, id, parentId: prevId, isBranchRoot: false };
    prevId = id;
    return migrated;
  });
}

async function loadSteps() {
  const r = await fetch('/api/chat/training-protocol/' + targetUserId);
  if (!r.ok) { document.getElementById('emptyHint').textContent = "You don't have access to this."; document.getElementById('emptyHint').style.display = 'block'; return; }
  const d = await r.json();
  steps = migrateSteps(d.steps || []);
  render();
}

async function saveSteps() {
  await fetch('/api/chat/training-protocol/' + targetUserId, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ steps }),
  });
}

// A protocol full of video steps was loading every single one the moment
// the page rendered, same issue as the picker — lazy-loads via data-src
// instead (see renderStepContent).
const stepVideoLazyObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const video = entry.target;
    if (video.dataset.src) { video.src = video.dataset.src; video.removeAttribute('data-src'); }
    stepVideoLazyObserver.unobserve(video);
  });
}, { rootMargin: '400px' });

// Every step has at most one "right" (continue this row) and one "below"
// (start a new row, x-aligned directly under it — never offset sideways,
// so the connector down to it is always a straight vertical line) child.
// Each row's own rightward chain is laid out completely independently of
// any other row — a below-subtree's own rightward extent never pushes
// anything in the row it branched off of, or any other ancestor row. Rows
// are stacked at different heights and never visually overlap regardless
// of which columns they use, so there's nothing to avoid colliding with —
// an earlier version propagated a below-subtree's width back up to shove
// its own PARENT's next same-row step further right "to make room" that
// was never actually needed, which showed up as unrelated steps jumping
// sideways whenever something completely unrelated was added several rows
// down.
const COL_W = 300, ROW_H = 210;
function childrenOf(list, pid) { return list.filter(s => s.parentId === pid); }
function primaryChildOf(list, node) { return childrenOf(list, node.id).find(k => !k.isBranchRoot) || null; }
function branchChildrenOf(list, node) { return childrenOf(list, node.id).filter(k => k.isBranchRoot); }

function computeLayout(list) {
  const pos = new Map();
  function layoutRow(node, col, row) {
    let cur = node, curCol = col;
    while (cur) {
      pos.set(cur.id, { x: curCol, row });
      const below = branchChildrenOf(list, cur)[0];
      if (below) layoutRow(below, curCol, row + 1);
      cur = primaryChildOf(list, cur);
      curCol += 1;
    }
  }
  let nextRootCol = 0;
  list.filter(s => !s.parentId).forEach(r => {
    layoutRow(r, nextRootCol, 0);
    // Next independent root tree starts past however far right THIS one's
    // own top row reached — a fresh root is the one case that genuinely
    // needs to avoid the previous root's row 0, since row 0 is shared.
    let maxCol = nextRootCol, cur = r;
    while (cur) { maxCol = Math.max(maxCol, pos.get(cur.id).x); cur = primaryChildOf(list, cur); }
    nextRootCol = maxCol + 1;
  });
  return pos;
}

function hasPrimaryChild(step) { return steps.some(c => c.parentId === step.id && !c.isBranchRoot); }

// Every step has at most one "right" child (continue this row) and one
// "below" child (isBranchRoot — start a new row under it) — a simple grid,
// not a fan of parallel branches. Both +'s open the same plain content
// picker, differing only in which direction the new step attaches.
function openAddStepModal(target) {
  pendingStepTarget = target;
  openModal('chooseTypeModal');
}

// Numbered across the whole protocol (every branch), not just the current
// chain being edited — "Day" is a program-wide sequence, so the next one
// added anywhere should follow whatever the highest Day used so far was.
function nextDayNumber() {
  const nums = steps.filter(s => s.type === 'day').map(s => s.dayNumber || 0);
  return nums.length ? Math.max(...nums) + 1 : 1;
}

// Splices a new step into an existing connector — the new step takes over
// the old child's exact relationship to the parent (straight continuation
// or branch-root elbow, whichever the clicked line was), and the old
// child becomes the new step's own plain continuation, since past the
// insertion point it's just carrying on the same chain either way.
async function insertStepBetween(parentId, childId, fields) {
  const child = steps.find(s => s.id === childId);
  const step = { id: newId(), parentId, isBranchRoot: child.isBranchRoot, ...fields };
  child.parentId = step.id;
  child.isBranchRoot = false;
  steps.push(step);
  render();
  await saveSteps();
  return step;
}

async function commitNewStep(fields) {
  snapshotBeforeChange();
  if (pendingStepTarget?.mode === 'insert') {
    return await insertStepBetween(pendingStepTarget.parentId, pendingStepTarget.childId, fields);
  }
  // Filling a placeholder slot replaces it in place — same parentId/
  // isBranchRoot the empty slot already had — rather than leaving the
  // placeholder behind next to the newly-filled step.
  const fillingPlaceholderId = pendingStepTarget?.mode === 'fill-placeholder' ? pendingStepTarget.placeholderId : null;
  if (fillingPlaceholderId) {
    steps = steps.filter(s => s.id !== fillingPlaceholderId);
  }
  const step = { id: newId(), parentId: pendingStepTarget?.parentId ?? null, isBranchRoot: !!pendingStepTarget?.isBranchRoot, ...fields };
  steps.push(step);
  // A placeholder created by deleting a step with descendants (see
  // .step-delete) can have real children hanging off it — those need to
  // move onto whatever just replaced it, or they'd be left pointing at a
  // parentId that no longer exists.
  if (fillingPlaceholderId) {
    steps.forEach(s => { if (s.parentId === fillingPlaceholderId) s.parentId = step.id; });
  }
  render();
  await saveSteps();
  return step;
}

function isDescendantOf(candidateId, ancestorId) {
  let cur = steps.find(s => s.id === candidateId);
  while (cur) {
    if (cur.id === ancestorId) return true;
    cur = steps.find(s => s.id === cur.parentId) || null;
  }
  return false;
}

// Drag-to-reorganize (see setupStepDrag) — relocates just the dragged step
// itself, not its own subtree. Whatever was attached to it reconnects to
// its old parent first (identical to deleting it), then it's attached at
// the drop target exactly like a fresh step would be there.
async function moveStepTo(stepId, target) {
  const step = steps.find(s => s.id === stepId);
  if (!step) return;
  snapshotBeforeChange();
  childrenOf(steps, stepId).forEach(c => {
    c.parentId = step.parentId;
    if (!c.isBranchRoot) c.isBranchRoot = step.isBranchRoot;
  });
  if (target.kind === 'insert') {
    const child = steps.find(s => s.id === target.childId);
    step.parentId = target.parentId;
    step.isBranchRoot = child.isBranchRoot;
    child.parentId = step.id;
    child.isBranchRoot = false;
  } else if (target.kind === 'plus') {
    step.parentId = target.parentId;
    step.isBranchRoot = target.isBranchRoot;
  } else if (target.kind === 'placeholder') {
    const ph = steps.find(s => s.id === target.placeholderId);
    step.parentId = ph.parentId;
    step.isBranchRoot = ph.isBranchRoot;
    steps = steps.filter(s => s.id !== ph.id);
  }
  render();
  await saveSteps();
}

function render() {
  const emptyHint = document.getElementById('emptyHint');
  const canvas = document.getElementById('protocolCanvas');
  const firstBtn = document.getElementById('addFirstStepBtn');
  firstBtn.style.display = canEdit ? '' : 'none';
  firstBtn.onclick = () => openAddStepModal({ parentId: null, isBranchRoot: false, mode: 'continue' });

  if (!steps.length) {
    emptyHint.style.display = 'block';
    canvas.style.display = 'none';
    return;
  }
  emptyHint.style.display = 'none';
  canvas.style.display = 'block';

  const world = document.getElementById('protocolWorld');
  const svg = document.getElementById('protocolConnectors');
  const pos = computeLayout(steps);
  let maxX = 0, maxRow = 0;
  pos.forEach(p => { maxX = Math.max(maxX, p.x); maxRow = Math.max(maxRow, p.row); });
  const worldW = (maxX + 1) * COL_W + 60, worldH = (maxRow + 1) * ROW_H + 60;
  world.style.width = worldW + 'px';
  world.style.height = worldH + 'px';
  svg.setAttribute('width', worldW);
  svg.setAttribute('height', worldH);

  world.innerHTML = steps.map(s => {
    const p = pos.get(s.id);
    const slotCenter = p.x * COL_W + 20, top = p.row * ROW_H + 20;
    if (s.type === 'placeholder') {
      // Bare + (no card chrome) sitting centered in its reserved slot —
      // clicking it opens the normal content picker to fill it in.
      const left = slotCenter - 22;
      return `
        <div class="step-node step-node-placeholder" data-id="${s.id}" data-row="${p.row}" style="left:${left}px;top:${top}px">
          <button class="step-placeholder" data-id="${s.id}" title="Fill this step">+</button>
          ${canEdit ? `<button class="step-placeholder-delete" data-id="${s.id}" title="Remove">✕</button>` : ''}
        </div>
      `;
    }
    const left = slotCenter - 130; // center the 260px card within its slot
    // Right-+ only once this row has nowhere further to continue; below-+
    // only once there's no step below it yet — each step gets at most one
    // of each, a plain grid rather than a branch fan.
    const isTip = !hasPrimaryChild(s);
    const hasBelowChild = branchChildrenOf(steps, s).length > 0;
    return `
      <div class="step-node" data-id="${s.id}" data-row="${p.row}" style="left:${left}px;top:${top}px">
        <div class="pra-panel step-card">
          ${canEdit ? `<button class="step-drag-handle" data-id="${s.id}" title="Drag to move">⠿</button>` : ''}
          ${canEdit ? `<button class="step-delete" data-id="${s.id}" title="Remove step">✕</button>` : ''}
          ${canEdit && s.type === 'text' ? `<button class="step-edit" data-id="${s.id}" title="Edit text">✎</button>` : ''}
          ${renderStepContent(s)}
        </div>
        ${canEdit && isTip ? `<button class="step-plus step-plus-right" data-parent="${s.id}" data-branch="false" title="Add next step">+</button>` : ''}
        ${canEdit && !hasBelowChild ? `<button class="step-plus step-plus-below" data-parent="${s.id}" data-branch="true" title="Add step below">+</button>` : ''}
      </div>
    `;
  }).join('');

  // ROW_H is only a starting estimate — a video card can render much
  // taller than a text note, and a fixed row height let a tall card in
  // one row visually collide with (or leave a huge/disconnected-looking
  // gap before) whatever's on the row below it, breaking the connector
  // math. Reading offsetHeight below forces a synchronous layout, so the
  // real heights are already there to measure immediately — no need to
  // wait a frame (and rAF doesn't reliably fire at all in a backgrounded/
  // non-composited view, which made this silently never run).
  layoutRowHeights();
  drawConnectors();

  world.querySelectorAll('.step-delete').forEach(btn => {
    btn.onclick = async () => {
      snapshotBeforeChange();
      const id = btn.dataset.id;
      const target = steps.find(s => s.id === id);
      // Deleting a step reconnects whatever was attached to it straight to
      // its own parent — the closest step still standing — rather than
      // leaving anything behind in its place. A continuation child takes
      // over the exact slot the deleted step occupied (same isBranchRoot
      // it had relative to ITS parent); a branch child just moves its
      // branch point up one level and stays a branch.
      childrenOf(steps, id).forEach(c => {
        c.parentId = target.parentId;
        if (!c.isBranchRoot) c.isBranchRoot = target.isBranchRoot;
      });
      steps = steps.filter(s => s.id !== id);
      render();
      await saveSteps();
    };
  });
  world.querySelectorAll('.step-edit').forEach(btn => {
    btn.onclick = () => {
      const s = steps.find(x => x.id === btn.dataset.id);
      if (!s) return;
      editingStepId = s.id;
      document.getElementById('textStepInput').value = s.content || '';
      openModal('textModal');
    };
  });
  world.querySelectorAll('.step-plus').forEach(btn => {
    btn.onclick = () => {
      openAddStepModal({ parentId: btn.dataset.parent, isBranchRoot: btn.dataset.branch === 'true', mode: 'continue' });
    };
  });
  world.querySelectorAll('.step-placeholder').forEach(btn => {
    btn.onclick = () => {
      const ph = steps.find(s => s.id === btn.dataset.id);
      // Placeholders aren't always branch slots any more — a deleted step
      // with descendants leaves one behind in whatever slot it occupied,
      // continuation or branch — so this has to carry the placeholder's
      // own isBranchRoot through rather than assuming branch.
      if (ph) openAddStepModal({ parentId: ph.parentId, isBranchRoot: ph.isBranchRoot, mode: 'fill-placeholder', placeholderId: ph.id });
    };
  });
  world.querySelectorAll('.step-placeholder-delete').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      snapshotBeforeChange();
      // A placeholder is only ever an empty slot with nothing attached to
      // it — there's no fill-it-in button that lets anything get added
      // underneath an unfilled one — so this never needs to reconnect
      // anything, just remove it.
      steps = steps.filter(s => s.id !== btn.dataset.id);
      render();
      await saveSteps();
    };
  });
  world.querySelectorAll('video[data-src]').forEach(v => stepVideoLazyObserver.observe(v));
  // A video's real height isn't known until its metadata actually loads
  // (async, and lazy — see stepVideoLazyObserver above) — layoutRowHeights
  // ran once already off whatever placeholder size the browser gave an
  // unloaded <video>, so every card re-settles once each video reports
  // its true size instead of leaving rows sized for the wrong guess.
  world.querySelectorAll('.step-card video').forEach(v => {
    v.addEventListener('loadedmetadata', () => { layoutRowHeights(); drawConnectors(); }, { once: true });
  });

  if (!canvasInitialized) { canvasInitialized = true; fitCanvasToView(); }
}

// A gap between rows generous enough for a branch elbow's vertical drop
// plus the below-+ button hanging under whatever's on the row above.
const ROW_GAP = 110;
// render() first lays every row out at a fixed guess (ROW_H) just to get
// real elements into the DOM — a video card routinely renders much taller
// than a text note, so that guess is often wrong. This pushes every row
// down to actually clear the tallest card in the row above it, using each
// node's real measured height instead of the guess.
function layoutRowHeights() {
  const world = document.getElementById('protocolWorld');
  const svg = document.getElementById('protocolConnectors');
  const nodes = [...world.querySelectorAll('.step-node')];
  if (!nodes.length) return;
  const maxHeightByRow = new Map();
  nodes.forEach(el => {
    const row = Number(el.dataset.row);
    maxHeightByRow.set(row, Math.max(maxHeightByRow.get(row) || 0, el.offsetHeight));
  });
  const maxRow = Math.max(...maxHeightByRow.keys());
  const rowTop = [20];
  for (let r = 1; r <= maxRow; r++) {
    rowTop[r] = rowTop[r - 1] + (maxHeightByRow.get(r - 1) || 0) + ROW_GAP;
  }
  nodes.forEach(el => { el.style.top = rowTop[Number(el.dataset.row)] + 'px'; });
  const worldH = rowTop[maxRow] + (maxHeightByRow.get(maxRow) || 0) + 60;
  world.style.height = worldH + 'px';
  svg.setAttribute('height', worldH);
}

// A fixed Y-offset from each row's top, used for every horizontal
// connector endpoint instead of each card's own vertical center — cards on
// the same row already share the same top (see render()), but their
// heights vary a lot (a text note vs. a video), so center-to-center lines
// went visibly diagonal between two different-height cards on one row.
// Anchoring to the same offset for everyone on a row keeps every
// same-row connection perfectly horizontal, and top-alignment is
// untouched (still just each card's own top).
const CONNECTOR_ANCHOR_Y = 30;
function drawConnectors() {
  const svg = document.getElementById('protocolConnectors');
  const world = document.getElementById('protocolWorld');
  const insertLayer = document.getElementById('protocolInsertLayer');
  const nodeEls = new Map();
  world.querySelectorAll('.step-node').forEach(el => nodeEls.set(el.dataset.id, el));
  let paths = '', inserts = '';
  steps.forEach(s => {
    const parentEl = nodeEls.get(s.id);
    if (!parentEl) return;
    const pLeft = parentEl.offsetLeft, pTop = parentEl.offsetTop, pW = parentEl.offsetWidth, pH = parentEl.offsetHeight;
    steps.filter(c => c.parentId === s.id).forEach(k => {
      const childEl = nodeEls.get(k.id);
      if (!childEl) return;
      // A step can only be spliced into a real (non-placeholder) chain
      // link — a placeholder isn't real content yet, and there's nothing
      // meaningful to insert "before" an empty branch slot.
      const canInsert = canEdit && k.type !== 'placeholder';
      const cLeft = childEl.offsetLeft, cTop = childEl.offsetTop, cW = childEl.offsetWidth;
      const cAnchorY = cTop + CONNECTOR_ANCHOR_Y;
      if (k.isBranchRoot) {
        // Drop straight down from the parent's actual bottom edge, then
        // bend once — a clean right-angle elbow, never a diagonal. Ends at
        // the child's actual horizontal CENTER, not its left edge — a
        // branch card's own position is rarely centered under its parent
        // (only the whole branch subtree is), so ending at its edge left
        // an unwarranted horizontal jog even in the simplest single-branch
        // case, and put the insert-+ dot (which sits at this segment's
        // midpoint) visibly off from where the line actually looked centered.
        // Bends at the vertical midpoint of the actual gap between the
        // parent's bottom edge and the child's top edge — not cAnchorY
        // (30px INSIDE the child's card), which put both the bend and the
        // insert-+ dot visibly overlapping the top of whatever card the
        // branch dropped into instead of floating cleanly in the gap
        // between them. For the common case of a lone branch with no
        // sideways offset (x1 === x2), this collapses to one clean
        // straight vertical line, not a dog-leg.
        const x1 = pLeft + pW / 2, y1 = pTop + pH, x2 = cLeft + cW / 2;
        const bendY = (y1 + cTop) / 2;
        paths += `<path d="M ${x1} ${y1} L ${x1} ${bendY} L ${x2} ${bendY} L ${x2} ${cTop}" fill="none" stroke="#fff" stroke-width="2"/>`;
        if (canInsert) inserts += `<button class="step-insert-plus" data-parent="${s.id}" data-child="${k.id}" style="left:${(x1 + x2) / 2}px;top:${bendY}px" title="Insert a step"></button>`;
      } else {
        const x1 = pLeft + pW, y1 = pTop + CONNECTOR_ANCHOR_Y, x2 = cLeft, y2 = cAnchorY;
        paths += `<path d="M ${x1} ${y1} L ${x2} ${y2}" fill="none" stroke="#fff" stroke-width="2"/>`;
        if (canInsert) inserts += `<button class="step-insert-plus" data-parent="${s.id}" data-child="${k.id}" style="left:${(x1 + x2) / 2}px;top:${y1}px" title="Insert a step"></button>`;
      }
    });
  });
  svg.innerHTML = paths;
  insertLayer.innerHTML = inserts;
  insertLayer.querySelectorAll('.step-insert-plus').forEach(btn => {
    btn.onclick = () => openAddStepModal({ parentId: btn.dataset.parent, childId: btn.dataset.child, mode: 'insert' });
  });
}

// Pan (drag/single-finger touch) and zoom (wheel/pinch), same interaction
// language as users-map.html's world — implemented as a plain CSS
// translate+scale here instead of an SVG viewBox crop, since this canvas
// holds real HTML step cards (video/image/text), not SVG shapes.
let canvasScale = 1, canvasX = 0, canvasY = 0;
function clampCanvasScale(s) { return Math.min(2.5, Math.max(0.25, s)); }
function applyCanvasTransform() {
  const t = `translate(${canvasX}px, ${canvasY}px) scale(${canvasScale})`;
  document.getElementById('protocolWorld').style.transform = t;
  document.getElementById('protocolConnectors').style.transform = t;
  document.getElementById('protocolInsertLayer').style.transform = t;
}
function fitCanvasToView() {
  const canvasEl = document.getElementById('protocolCanvas');
  const world = document.getElementById('protocolWorld');
  const rect = canvasEl.getBoundingClientRect();
  const w = parseFloat(world.style.width) || 1, h = parseFloat(world.style.height) || 1;
  canvasScale = clampCanvasScale(Math.min(rect.width / w, rect.height / h, 1));
  canvasX = Math.max(0, (rect.width - w * canvasScale) / 2);
  canvasY = 24;
  applyCanvasTransform();
}
// Grabbing a card's drag handle picks the step up and shows a small pill
// following the pointer; releasing over any + (mid-connector, add-next,
// add-below) or an empty placeholder drops it there. Uses pointer events
// rather than native HTML5 drag-and-drop specifically because that API
// doesn't fire on touch at all — this needs to work the same way with a
// finger as with a mouse.
function setupStepDrag() {
  let draggedId = null, ghost = null, hoverTarget = null;

  function targetFromEl(el) {
    if (!el) return null;
    const insert = el.closest('.step-insert-plus');
    if (insert && insert.dataset.child) return { el: insert, kind: 'insert', parentId: insert.dataset.parent, childId: insert.dataset.child };
    const plus = el.closest('.step-plus');
    if (plus) return { el: plus, kind: 'plus', parentId: plus.dataset.parent, isBranchRoot: plus.dataset.branch === 'true' };
    const ph = el.closest('.step-placeholder');
    if (ph) return { el: ph, kind: 'placeholder', placeholderId: ph.dataset.id };
    return null;
  }
  function setHover(target) {
    if (hoverTarget?.el === target?.el) return;
    hoverTarget?.el.classList.remove('drop-target-hover');
    hoverTarget = target;
    hoverTarget?.el.classList.add('drop-target-hover');
  }
  function cleanup() {
    ghost?.remove(); ghost = null;
    hoverTarget?.el.classList.remove('drop-target-hover'); hoverTarget = null;
    draggedId = null;
    document.body.style.userSelect = '';
  }

  document.getElementById('protocolCanvas').addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.step-drag-handle');
    if (!handle) return;
    e.preventDefault();
    e.stopPropagation();
    draggedId = handle.dataset.id;
    document.body.style.userSelect = 'none';
    ghost = document.createElement('div');
    ghost.className = 'step-drag-ghost';
    ghost.textContent = 'Moving…';
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    document.body.appendChild(ghost);
  });
  window.addEventListener('pointermove', (e) => {
    if (!draggedId) return;
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    setHover(targetFromEl(document.elementFromPoint(e.clientX, e.clientY)));
  });
  window.addEventListener('pointerup', async () => {
    if (!draggedId) return;
    const id = draggedId, target = hoverTarget;
    cleanup();
    if (!target) return;
    // A step can't be dropped onto itself, onto the connector it's already
    // the child of, or under one of its own descendants — any of those
    // would either be a no-op or orphan part of the tree into a cycle.
    if (target.kind === 'insert' && target.childId === id) return;
    if (target.parentId && (target.parentId === id || isDescendantOf(target.parentId, id))) return;
    await moveStepTo(id, target);
  });
}

function setupCanvasPanZoom() {
  const canvasEl = document.getElementById('protocolCanvas');

  canvasEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvasEl.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const worldX = (mx - canvasX) / canvasScale, worldY = (my - canvasY) / canvasScale;
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    canvasScale = clampCanvasScale(canvasScale * factor);
    canvasX = mx - worldX * canvasScale;
    canvasY = my - worldY * canvasScale;
    applyCanvasTransform();
  }, { passive: false });

  // Only the card's actual interactive controls need to keep their own
  // native behavior — everything else on a step card (its body, text,
  // thumbnail, and the video itself) should still let a drag pan the
  // canvas, so panning isn't limited to hunting for blank space between
  // nodes. Video is deliberately NOT excluded here: its native play/scrub
  // controls only appear as an overlay when tapped, so a drag starting
  // anywhere on the video element itself should pan like the rest of the
  // card.
  const isInteractiveTarget = (target) => !!target.closest('button, input, textarea, select, a');

  let dragging = false, dragStartX = 0, dragStartY = 0, startCanvasX = 0, startCanvasY = 0;
  canvasEl.addEventListener('mousedown', (e) => {
    if (isInteractiveTarget(e.target)) return; // clicks/drags on card controls behave normally
    dragging = true;
    canvasEl.classList.add('dragging');
    dragStartX = e.clientX; dragStartY = e.clientY;
    startCanvasX = canvasX; startCanvasY = canvasY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    canvasX = startCanvasX + (e.clientX - dragStartX);
    canvasY = startCanvasY + (e.clientY - dragStartY);
    applyCanvasTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; canvasEl.classList.remove('dragging'); });

  let pinchStartDist = 0, pinchStartScale = 1, touchStartX = 0, touchStartY = 0, touchStartCanvasX = 0, touchStartCanvasY = 0;
  // The world point under the pinch's starting midpoint — fixed once at
  // gesture start, not recomputed from the live midpoint every touchmove.
  // Recomputing it every frame (using that frame's own just-updated
  // canvasX/Y as input to the next) let tiny per-frame rounding compound
  // over a whole gesture, and any drift in the two fingers' midpoint
  // shifted which world point was "anchored" mid-gesture — both read as
  // the view jumping away from wherever the pinch actually started.
  let pinchAnchorWorldX = 0, pinchAnchorWorldY = 0;
  function touchDist(touches) {
    return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
  }
  // Real fingers rarely land in the exact same instant — one touches down
  // first (setting up single-finger pan, since it doesn't yet know a
  // second is coming), then the second lands a beat later to start the
  // pinch. If that first finger drifted even a pixel in between, a pan
  // update could slip in and shift canvasX/Y right before the pinch
  // anchor gets computed from it — landing the anchor on the wrong point.
  // Clearing the pan state the moment a 2nd touch appears, and refusing
  // to apply pan updates once a pinch is active, makes the two paths
  // mutually exclusive so that race can't happen.
  canvasEl.addEventListener('touchstart', (e) => {
    if (e.touches.length >= 2) {
      touchStartX = 0; // a pinch is starting — any pending single-finger pan is void
      pinchStartDist = touchDist(e.touches); pinchStartScale = canvasScale;
      const rect = canvasEl.getBoundingClientRect();
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      pinchAnchorWorldX = (midX - canvasX) / canvasScale;
      pinchAnchorWorldY = (midY - canvasY) / canvasScale;
    } else if (e.touches.length === 1 && !isInteractiveTarget(e.target)) {
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
      touchStartCanvasX = canvasX; touchStartCanvasY = canvasY;
    }
  }, { passive: true });
  canvasEl.addEventListener('touchmove', (e) => {
    if (e.touches.length >= 2 && pinchStartDist) {
      e.preventDefault();
      const rect = canvasEl.getBoundingClientRect();
      const dist = touchDist(e.touches);
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      canvasScale = clampCanvasScale(pinchStartScale * (dist / pinchStartDist));
      canvasX = midX - pinchAnchorWorldX * canvasScale;
      canvasY = midY - pinchAnchorWorldY * canvasScale;
      applyCanvasTransform();
    } else if (e.touches.length === 1 && touchStartX && !pinchStartDist) {
      e.preventDefault();
      canvasX = touchStartCanvasX + (e.touches[0].clientX - touchStartX);
      canvasY = touchStartCanvasY + (e.touches[0].clientY - touchStartY);
      applyCanvasTransform();
    }
  }, { passive: false });
  canvasEl.addEventListener('touchend', (e) => {
    pinchStartDist = 0;
    if (e.touches.length === 0) touchStartX = 0;
  });

  canvasEl.addEventListener('dblclick', (e) => {
    if (e.target.closest('.step-node')) return;
    fitCanvasToView();
  });
}

function renderStepContent(s) {
  if (s.type === 'video') {
    return `<video data-src="/api/chat/media/${s.driveFileId}#t=0.5" controls loop preload="metadata" playsinline></video>`;
  }
  if (s.type === 'image') {
    return `<div class="step-type">Image</div><img src="/api/chat/media/${s.driveFileId}"/>`;
  }
  if (s.type === 'day') {
    return `<div class="step-day-badge">Day ${s.dayNumber}</div>`;
  }
  return `<div class="step-text">${escapeHtml(s.content || '')}</div>`;
}

function wireModals() {
  document.getElementById('chooseVideo').onclick = () => {
    closeModal('chooseTypeModal');
    document.getElementById('videoSearchInput').value = '';
    document.getElementById('videoResults').innerHTML = '';
    openModal('videoModal');
    searchVideos('');
  };
  document.getElementById('chooseUploadVideo').onclick = () => {
    closeModal('chooseTypeModal');
    document.getElementById('videoFileInput').value = '';
    document.getElementById('videoFileInput').click(); // straight to the OS file picker, no modal in between
  };
  document.getElementById('chooseImage').onclick = () => {
    closeModal('chooseTypeModal');
    document.getElementById('imageFileInput').value = '';
    document.getElementById('imageUploadMsg').textContent = '';
    openModal('imageModal');
  };
  document.getElementById('chooseText').onclick = () => {
    closeModal('chooseTypeModal');
    document.getElementById('textStepInput').value = '';
    openModal('textModal');
  };
  document.getElementById('chooseTemplate').onclick = () => {
    closeModal('chooseTypeModal');
    document.getElementById('templateSearchInput').value = '';
    openModal('templateModal');
    searchTemplates('');
  };
  document.getElementById('chooseDay').onclick = async () => {
    closeModal('chooseTypeModal');
    await commitNewStep({ type: 'day', dayNumber: nextDayNumber() });
  };

  let templateSearchTimer;
  document.getElementById('templateSearchInput').addEventListener('input', (e) => {
    clearTimeout(templateSearchTimer);
    templateSearchTimer = setTimeout(() => searchTemplates(e.target.value), 250);
  });
  document.getElementById('templateAddBtn').onclick = submitNewTemplate;

  let searchTimer;
  document.getElementById('videoSearchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => searchVideos(e.target.value), 300);
  });

  document.getElementById('videoFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return; // user cancelled the OS picker
    const msg = document.getElementById('uploadStatusMsg');
    msg.textContent = 'Uploading…';
    const fd = new FormData();
    fd.append('video', file);
    try {
      const r = await fetch('/api/chat/training-protocol/upload-video', { method: 'POST', body: fd });
      const d = await r.json();
      if (!r.ok) { msg.textContent = d.error || 'Upload failed.'; return; }
      await commitNewStep({ type: 'video', driveFileId: d.driveFileId, name: d.name });
      msg.textContent = '';
    } catch {
      msg.textContent = 'Upload failed.';
    }
  });

  document.getElementById('imageUploadBtn').onclick = async () => {
    const file = document.getElementById('imageFileInput').files[0];
    const msg = document.getElementById('imageUploadMsg');
    if (!file) { msg.textContent = 'Choose a file first.'; return; }
    msg.textContent = 'Uploading…';
    const fd = new FormData();
    fd.append('image', file);
    const r = await fetch('/api/chat/training-protocol/upload-image', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) { msg.textContent = d.error || 'Upload failed.'; return; }
    await commitNewStep({ type: 'image', driveFileId: d.driveFileId });
    closeModal('imageModal');
  };

  document.getElementById('textStepSaveBtn').onclick = async () => {
    const content = document.getElementById('textStepInput').value.trim();
    if (!content) return;
    if (editingStepId) {
      snapshotBeforeChange();
      const s = steps.find(x => x.id === editingStepId);
      if (s) s.content = content;
      editingStepId = null;
      render();
      await saveSteps();
    } else {
      await commitNewStep({ type: 'text', content });
    }
    closeModal('textModal');
  };
  // Reset edit state on every close path (Cancel button, backdrop click,
  // Esc if ever added) so a stale editingStepId can't silently turn the
  // next unrelated "Add Text" flow into an edit of whatever was last opened.
  document.getElementById('textModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget || e.target.closest('.pra-btn-ghost')) editingStepId = null;
  });
}

// Lazy-loads each thumbnail's actual video only once it scrolls into view
// (rootMargin gives it a 150px head start) instead of every result on the
// page — could be dozens — all trying to fetch metadata simultaneously the
// moment a search returns. One shared observer for the whole modal;
// unobserve right after loading since a thumbnail only ever needs this once.
const videoThumbObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const video = entry.target;
    if (video.dataset.src) { video.src = video.dataset.src; video.removeAttribute('data-src'); }
    videoThumbObserver.unobserve(video);
  });
}, { rootMargin: '150px' });

let videoNextPageToken = null;
let videoCurrentQuery = '';
let videoLoadingMore = false;
let videoSentinelObserver = null;

function videoResultCardHtml(f) {
  return `
    <div class="video-result" data-id="${f.id}" data-name="${escapeHtml(f.name)}">
      <div class="video-result-thumb">
        <video data-src="/api/chat/media/${f.id}#t=0.5" preload="metadata" muted playsinline></video>
        <div class="play-icon">▶</div>
      </div>
      <div class="video-result-name">${escapeHtml(f.name)}</div>
    </div>`;
}

function wireVideoResultCards(box) {
  box.querySelectorAll('.video-result').forEach(el => {
    if (el.dataset.wired) return;
    el.dataset.wired = '1';
    el.onclick = async () => {
      await commitNewStep({ type: 'video', driveFileId: el.dataset.id, name: el.dataset.name });
      closeModal('videoModal');
    };
  });
  box.querySelectorAll('.video-result-thumb video[data-src]').forEach(v => videoThumbObserver.observe(v));
}

// Grid of cards (Choose a Video) instead of a thin list, sized to land
// close to 6 visible before scrolling — same visual language as
// Powerbatics Training Videos' big thumbnails. Scrolling to the bottom
// loads more via the Drive API's own pageToken instead of the previous
// flat 50-result cap that just silently ran out.
async function searchVideos(q) {
  const box = document.getElementById('videoResults');
  box.className = '';
  videoCurrentQuery = q;
  videoNextPageToken = null;
  if (videoSentinelObserver) { videoSentinelObserver.disconnect(); videoSentinelObserver = null; }
  box.innerHTML = '<div class="pra-muted" style="font-size:.85rem">Searching…</div>';
  const r = await fetch('/api/chat/training-protocol/search-videos?q=' + encodeURIComponent(q));
  const d = await r.json();
  if (d.needsConfig) { box.innerHTML = '<div class="pra-muted" style="font-size:.85rem">Ask an admin to set the Training Protocol Videos folder in Admin Settings.</div>'; return; }
  if (!d.files || !d.files.length) { box.innerHTML = '<div class="pra-muted" style="font-size:.85rem">No videos found.</div>'; return; }
  videoNextPageToken = d.nextPageToken;
  box.className = 'video-results-grid';
  box.innerHTML = d.files.map(videoResultCardHtml).join('') + '<div class="video-results-sentinel" id="videoResultsSentinel"></div>';
  wireVideoResultCards(box);
  const sentinel = document.getElementById('videoResultsSentinel');
  videoSentinelObserver = new IntersectionObserver((entries) => {
    if (entries.some(e => e.isIntersecting)) loadMoreVideos();
  });
  videoSentinelObserver.observe(sentinel);
}

async function loadMoreVideos() {
  if (!videoNextPageToken || videoLoadingMore) return;
  videoLoadingMore = true;
  const sentinel = document.getElementById('videoResultsSentinel');
  const loadingEl = document.createElement('div');
  loadingEl.className = 'video-results-loading';
  loadingEl.textContent = 'Loading more…';
  sentinel?.before(loadingEl);
  const r = await fetch('/api/chat/training-protocol/search-videos?q=' + encodeURIComponent(videoCurrentQuery) + '&pageToken=' + encodeURIComponent(videoNextPageToken));
  const d = await r.json();
  loadingEl.remove();
  videoNextPageToken = d.nextPageToken;
  if (d.files && d.files.length) {
    sentinel?.insertAdjacentHTML('beforebegin', d.files.map(videoResultCardHtml).join(''));
    wireVideoResultCards(document.getElementById('videoResults'));
  }
  if (!videoNextPageToken && videoSentinelObserver) videoSentinelObserver.disconnect();
  videoLoadingMore = false;
}

async function searchTemplates(q) {
  const box = document.getElementById('templateResults');
  box.innerHTML = '<div class="pra-muted" style="font-size:.85rem">Searching…</div>';
  const r = await fetch('/api/chat/protocol-step-templates?q=' + encodeURIComponent(q));
  const d = await r.json();
  const templates = d.templates || [];
  if (!templates.length) { box.innerHTML = '<div class="pra-muted" style="font-size:.85rem">No saved text found.</div>'; return; }
  const isAdmin = me.role === 'admin' || me.role === 'admin2';
  box.innerHTML = templates.map(t => `
    <div class="template-item" data-id="${t.id}">
      <div class="template-item-body">
        <div class="template-item-title">${escapeHtml(t.title)}</div>
        <div class="template-item-text">${escapeHtml(t.text)}</div>
      </div>
      ${isAdmin ? `<button class="template-delete-btn" title="Delete template">🗑</button>` : ''}
    </div>
  `).join('');
  box.querySelectorAll('.template-item').forEach(row => {
    const t = templates.find(x => x.id === row.dataset.id);
    row.querySelector('.template-item-body').onclick = async () => {
      await commitNewStep({ type: 'text', content: t.text });
      closeModal('templateModal');
    };
    const delBtn = row.querySelector('.template-delete-btn');
    if (delBtn) delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(`Delete the "${t.title}" saved text?`)) return;
      await fetch('/api/chat/protocol-step-templates/' + t.id, { method: 'DELETE' });
      searchTemplates(document.getElementById('templateSearchInput').value || '');
    };
  });
}

async function submitNewTemplate() {
  const title = document.getElementById('templateAddTitle').value.trim();
  const text = document.getElementById('templateAddText').value.trim();
  if (!title || !text) { alert('Title and text are required.'); return; }
  const r = await fetch('/api/chat/protocol-step-templates', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, text })
  });
  if (!r.ok) { const d = await r.json().catch(() => ({})); alert(d.error || 'Could not save template.'); return; }
  document.getElementById('templateAddTitle').value = '';
  document.getElementById('templateAddText').value = '';
  searchTemplates(document.getElementById('templateSearchInput').value || '');
}

// Only meaningful when this page was reached from a specific chat (the
// "Current Training Protocol" link, which passes ?convo=) — the other entry
// point is the persistent header's own "My Training Protocol" icon, which
// has no conversation to go back to and would otherwise land on chat.html's
// blank "Select a chat" screen instead of anywhere useful.
if (!sourceConvoId) document.getElementById('backBtn').style.display = 'none';

// Explicit deep link back to the exact conversation this page was opened
// from (passed as ?convo= by chat.html's protocol link), not history.back()
// — chat.html is served with Cache-Control: no-store (needed to stop stale
// JS sticking around after a deploy), which also defeats the browser's
// bfcache, so a plain back-navigation would reload chat.html from scratch
// with nothing open rather than landing back on the right thread.
document.getElementById('backBtn').onclick = () => {
  location.href = sourceConvoId
    ? '/chat-app/chat.html?convo=' + encodeURIComponent(sourceConvoId)
    : '/chat-app/chat.html';
};

init();
</script>
